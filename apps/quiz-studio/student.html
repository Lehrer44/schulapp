<style>
:root{color-scheme:light;--bg:#f3f1e9;--surface:#fffefa;--soft:#faf8f1;--line:#d9d2c2;--line-strong:#b9ad93;--text:#34352e;--muted:#777668;--accent:#88784f;--dark:#665a3d;--accent-soft:#eee7d5;--danger:#b9504e;--danger-soft:#f8e8e5;--ok:#36795d;--ok-soft:#e5f1e8;--shadow:0 14px 36px rgba(69,59,37,.07)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.45 Inter,"Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 8% 0%,rgba(255,255,255,.88),transparent 38rem),linear-gradient(145deg,#f5f3ed 0%,var(--bg) 58%,#ebe7dc 100%)}button,input{font:inherit}button{border:1px solid transparent;border-radius:10px;padding:11px 14px;background:var(--dark);color:#fffdf7;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:var(--surface);color:var(--text);border-color:var(--line)}.wrap{width:min(100%,1000px);margin:0 auto;padding:clamp(12px,3vw,28px)}.top{display:flex;align-items:center;gap:12px;padding:16px 18px;background:rgba(255,254,250,.88);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px}.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--dark);border-radius:12px;color:white;font-weight:900;font-size:1.3rem}.title{font-weight:900;font-size:1.15rem;letter-spacing:-.03em}.sub{color:var(--muted);font-size:.84rem}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:15px;align-items:start}.main,.side{display:flex;flex-direction:column;gap:15px;min-width:0}.panel{background:rgba(255,254,250,.94);border:1px solid var(--line);border-radius:18px;padding:clamp(15px,2.6vw,26px);box-shadow:var(--shadow);min-width:0}.eyebrow{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:900;color:var(--accent);margin-bottom:5px}h1{font-size:clamp(1.4rem,3vw,2rem);line-height:1.2;margin:2px 0 12px;letter-spacing:-.03em}h2{font-size:1.05rem;margin:0 0 12px}.muted{color:var(--muted)}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:.86rem;font-weight:800;color:var(--muted)}.field input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:13px 14px;background:white;color:var(--text);min-width:0}.field input:focus{outline:3px solid #d7c99f;outline-offset:1px}.code-input{text-transform:uppercase;letter-spacing:.2em;font-size:1.4rem;font-weight:900;text-align:center}.full{width:100%;margin-top:8px}.notice{padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:#8e3837;border:1px solid #e7c1bc;margin-top:12px}.waiting{padding:22px 16px;text-align:center;background:var(--soft);border:1px dashed var(--line-strong);border-radius:14px;color:var(--muted)}.waiting-icon{font-size:2rem;margin-bottom:8px}.answers{display:flex;flex-direction:column;gap:9px}.answer{display:flex;align-items:flex-start;gap:11px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:white;cursor:pointer;font-weight:650;overflow-wrap:anywhere}.answer:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}.answer input{width:19px;height:19px;flex:none;accent-color:var(--accent);margin:2px 0 0}.answer.correct{border-color:var(--ok);background:var(--ok-soft)}.text-answer{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:white;color:var(--text);font:inherit;min-height:52px}.text-answer:focus{outline:3px solid #d7c99f;outline-offset:1px}.rank-choices{display:flex;flex-direction:column;gap:8px}.rank-choice{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;align-items:center;padding:9px 10px;background:white;border:1px solid var(--line);border-radius:11px}.rank-choice button{padding:6px 10px;background:var(--surface);color:var(--text);border-color:var(--line)}.rank-num{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--accent-soft);border-radius:8px;margin-right:7px;font-weight:900;font-size:.8rem}.rank-name{overflow-wrap:anywhere}.status{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--dark);font-size:.8rem;font-weight:850}.status.green{background:var(--ok-soft);color:#245c41}.status.red{background:var(--danger-soft);color:#8e3837}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.question-bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.86rem;font-weight:800;color:var(--muted);margin-bottom:13px}.rank-list{display:flex;flex-direction:column;gap:7px}.rank-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--soft)}.rank-item.me{border-color:var(--ok);background:var(--ok-soft)}.rank-item.answered{border-color:#b4d8bf}.rank-no{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#eeeadd;font-size:.8rem;font-weight:900}.rank-person{font-weight:750;overflow-wrap:anywhere}.score{white-space:nowrap;font-weight:900;color:var(--dark)}.timer{font-weight:900;font-variant-numeric:tabular-nums;color:var(--dark)}.timer.expired{color:var(--danger)}.result{padding:13px;background:var(--ok-soft);border:1px solid #b4d8bf;border-radius:12px;color:#245c41;font-weight:750;margin-top:14px}.result.wrong{background:var(--danger-soft);border-color:#e7c1bc;color:#8e3837}.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 0}.hidden{display:none!important}
@media(max-width:740px){.wrap{padding:9px}.layout{grid-template-columns:minmax(0,1fr)}.side{display:flex}.top{padding:13px;border-radius:15px}.panel{border-radius:15px}.question-bar{font-size:.82rem}}

<script>
'use strict';
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
const PRESET_CODE=(params.get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
const STORAGE_KEY='quizstudio.live.student.v2';
let participantToken='';
function newParticipantToken(){return [...crypto.getRandomValues(new Uint8Array(32))].map(x=>x.toString(16).padStart(2,'0')).join('')}
let sessionId='',participantId='',participantName='',joinCode='',studentState=null,leaderboard=[],draftByQuestion={},rankDraftByQuestion={},pollBusy=false,saveBusy=false,pollTimer=null,timerTimer=null,lastRenderedKey='';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function messageFor(code){const map={JOIN_RATE_LIMITED:'Zu viele Beitrittsversuche. Bitte warte eine Minute.',INVALID_JOIN_INPUT:'Bitte prüfe Code und Namen.',INVALID_PARTICIPANT_TOKEN:'Deine Teilnahme ist nicht mehr gültig. Bitte tritt erneut bei.',PARTICIPANT_NAME_MISMATCH:'Bitte verwende deinen bisherigen Namen.',SESSION_NOT_FOUND:'Dieser Teilnahmecode ist nicht gültig oder das Quiz ist bereits beendet.',INVALID_INPUT:'Bitte gib einen gültigen Code und deinen Namen ein.',NAME_TAKEN:'Dieser Name wird in diesem Quiz bereits verwendet. Bitte wähle einen anderen Namen.',NAME_MISMATCH:'Bitte verwende den Namen, mit dem du dem Quiz ursprünglich beigetreten bist.',NOT_AUTHENTICATED:'Bitte melde dich erneut an.',QUESTION_NOT_ACTIVE:'Diese Frage ist nicht mehr aktiv. Die Ansicht wurde aktualisiert.',QUESTION_LOCKED:'Die Antwortphase ist beendet. Deine Antwort kann nicht mehr geändert werden.',INVALID_ANSWER:'Bitte überprüfe deine Antwort und versuche es erneut.'};return map[code]||code||'Unbekannter Fehler';}
function showNotice(text){const el=document.getElementById('notice');if(el){el.textContent=text;el.classList.remove('hidden');}else{const place=document.getElementById('formNotice');if(place){place.textContent=text;place.classList.remove('hidden');}}}
function loadStoredJoin(){try{return JSON.parse(sessionStorage.getItem(STORAGE_KEY)||'null');}catch(e){return null;}}
function saveStoredJoin(){try{sessionStorage.setItem(STORAGE_KEY,JSON.stringify({sessionId,participantId,participantName,joinCode,participantToken}));}catch(e){}}
function joinView(){
 app.innerHTML='<div class="panel"><div class="eyebrow">Mitspielen</div><h1>Quiz beitreten</h1><p class="muted">Gib den Teilnahmecode von der Tafel und deinen Namen ein. Die erste Frage erscheint erst, wenn die Lehrkraft startet.</p><form id="joinForm"><div class="field"><label for="joinCode">Teilnahmecode</label><input id="joinCode" class="code-input" maxlength="5" minlength="5" autocomplete="off" autocapitalize="characters" required value="'+esc(PRESET_CODE)+'" placeholder="A B C D E"></div><div class="field"><label for="studentName">Dein Name</label><input id="studentName" maxlength="40" minlength="1" autocomplete="name" required placeholder="Vorname oder vereinbarter Anzeigename"></div><div id="formNotice" class="notice hidden" role="alert"></div><button class="full" type="submit">Quiz beitreten →</button></form></div>';
 const code=document.getElementById('joinCode');code.addEventListener('input',()=>{code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);});
 document.getElementById('joinForm').addEventListener('submit',async e=>{e.preventDefault();const c=code.value.trim().toUpperCase(),name=document.getElementById('studentName').value.trim();const btn=e.submitter; if(btn)btn.disabled=true;
 try{await join(c,name,null);}catch(err){showNotice(messageFor(err.message));}finally{if(btn)btn.disabled=false;}});
}
async function rpc(name,args){const r=await db.rpc(name,args);if(r.error)throw new Error(r.error.message||'Verbindungsfehler');if(r.data&&r.data.ok===false)throw new Error(r.data.error||'Aktion fehlgeschlagen');return r.data;}
async function join(code,name,existingId){
 joinCode=code;participantName=name;
 if(!participantToken)participantToken=newParticipantToken();saveStoredJoin();
 const r=await rpc('classroom_join',{p_kind:'quiz',p_join_code:code,p_name:name,p_token:participantToken,p_participant_id:existingId||null});
 sessionId=r.session_id;participantId=r.participant_id;saveStoredJoin();
 await refreshState(true);
 if(pollTimer)clearInterval(pollTimer);
 let polledAt=0;pollTimer=setInterval(()=>{const interval=studentState?.play_mode&&studentState.play_mode!=='classic'?500:1600;if(Date.now()-polledAt>=interval){polledAt=Date.now();refreshState(false);}},250);
 if(timerTimer)clearInterval(timerTimer);
 timerTimer=setInterval(updateTimerDisplay,500);
}
function getAnswerDraft(q,idx){
 const current=studentState;
 const own=current&&current.own_response;
 const locked=!!(current&&(current.locked||current.revealed));
 if(locked) return own&&own.answer!==undefined?own.answer:(q.type==='multiple'?[]:q.type==='ranking'?(q.items||[]).map(x=>x.id):null);
 if(Object.prototype.hasOwnProperty.call(draftByQuestion,idx))return draftByQuestion[idx];
 return own&&own.answer!==undefined?own.answer:
   (q.type==='multiple'?[]:q.type==='ranking'?(q.items||[]).map(x=>x.id):null);
}
function renderRankingChoices(q,answer,idx,disabled){
 const items=(answer&&Array.isArray(answer)?answer:(q.items||[]).map(x=>x.id)).slice();
 const map=Object.fromEntries((q.items||[]).map(x=>[x.id,x]));
 rankDraftByQuestion[idx]=items;
 return '<div class="rank-choices">'+items.map((id,i)=>'<div class="rank-choice"><span class="rank-name"><span class="rank-num">'+(i+1)+'</span>'+QuizRichText.render(map[id]||{text:''})+'</span><button type="button" data-action="rank-move" data-index="'+idx+'" data-pos="'+i+'" data-dir="-1" aria-label="Element nach oben verschieben" '+(disabled||i===0?'disabled':'')+'>↑</button><button type="button" data-action="rank-move" data-index="'+idx+'" data-pos="'+i+'" data-dir="1" aria-label="Element nach unten verschieben" '+(disabled||i===items.length-1?'disabled':'')+'>↓</button></div>').join('')+'</div>';
}
function inputChoices(q,idx,locked,revealed,answer){
 if(q.type==='pin')return QuizPin.markup(q,{answer,showTarget:revealed,editable:!locked&&!revealed});
 const opts=q.type==='single'||q.type==='multiple'?(q.options||[]):q.type==='truefalse'?[{id:'true',text:'Wahr',value:true},{id:'false',text:'Falsch',value:false}]:[];
 const selected=(q.type==='multiple'&&Array.isArray(answer))?answer:[];
 if(q.type==='shortanswer')return '<input class="text-answer" id="shortAnswer" aria-label="Deine Kurzantwort" type="text" maxlength="2000" placeholder="Deine Antwort …" value="'+esc(answer==null?'':answer)+'" '+(locked||revealed?'disabled':'')+' autocomplete="off">';
 if(q.type==='ranking')return renderRankingChoices(q,answer,idx,locked||revealed);
 return '<div class="answers">'+opts.map(o=>{
  const val=q.type==='truefalse'?String(o.value):o.id;
  const checked=q.type==='multiple'?selected.includes(val):q.type==='truefalse'?answer===o.value:answer===o.id;
  const correct=revealed&&(q.type==='truefalse'?o.value===q.correct:!!o.correct);
  return '<label class="answer '+(correct?'correct':'')+'"><input type="'+(q.type==='multiple'?'checkbox':'radio')+'" name="studentAnswer" value="'+esc(val)+'" '+(checked?'checked':'')+' '+(locked||revealed?'disabled':'')+'><span>'+QuizRichText.render(o)+(correct?' ✓':'')+'</span></label>';
 }).join('')+'</div>';
}
function renderRanking(rows){
 if(!rows||!rows.length)return '<div class="waiting">Die Rangliste erscheint, sobald die Lehrkraft das Quiz startet.</div>';
 return '<div class="rank-list">'+rows.map((r,i)=>'<div class="rank-item '+(r.name===participantName?'me ':'')+(r.answered?'answered':'')+'"><span class="rank-no">'+(i+1)+'</span><span class="rank-person">'+esc(r.name)+(r.answered?' <span class="status green">Abgegeben</span>':'')+'</span><span class="score">'+(Number(r.score)||0).toLocaleString('de-DE')+' P</span></div>').join('')+'</div>';
}
function stateSignature(s){
 return [s.status,s.current_index,s.locked,s.revealed,JSON.stringify(s.question_state),JSON.stringify(s.question),JSON.stringify(s.own_response),JSON.stringify(s.leaderboard)].join('|');
}
function render(){
 const focused=document.activeElement,focusId=focused?.id,start=focused?.selectionStart,end=focused?.selectionEnd;
 const s=studentState;if(!s)return;
 const q=s.question, idx=s.current_index;
 document.getElementById('headerSub').textContent=s.title||'Quizteilnahme';
 document.getElementById('headerStatus').innerHTML='<span class="status '+(s.status==='running'&&!s.locked&&!s.revealed?'green':'')+'">'+(s.status==='lobby'?'Wartelobby':s.status==='ended'?'Beendet':s.revealed?'Aufgelöst':s.locked?'Gesperrt':'Live')+'</span>';
 let main='';
 if(s.status==='lobby'){
  main='<div class="panel"><div class="eyebrow">Du bist dabei</div><h1>'+esc(s.title)+'</h1><div class="waiting"><div class="waiting-icon">⏳</div><strong>Warte auf den Start</strong><p class="muted">Deine Lehrkraft startet das Quiz. Bis dahin sind noch keine Fragen sichtbar.</p></div></div>';
 }else if(s.status==='ended'||s.current_index>=s.question_count){
  const mine=(s.leaderboard||[]).find(r=>r.name===participantName);
  main='<div class="panel"><div class="eyebrow">Quiz beendet</div><h1>Geschafft, '+esc(participantName)+'!</h1><p class="muted">Dein endgültiger Punktestand</p><div style="font-size:2.5rem;font-weight:950;color:var(--dark)">'+(mine?Number(mine.score)||0:0)+' Punkte</div><p class="muted">Die Lehrkraft hat das Quiz beendet.</p></div>';
 }else if(!s.question){
  main='<div class="panel"><div class="waiting">Die nächste Frage wird vorbereitet …</div></div>';
 }else{
  const st=s.question_state||{},own=s.own_response||null,mode=s.play_mode||st.mode||'classic';
  if(mode==='buzzer'){main=buzzerMarkup(s,q,idx);}
  else{
  let answer=getAnswerDraft(q,idx);
  if(own&&own.answer!==undefined&&!Object.prototype.hasOwnProperty.call(draftByQuestion,idx))answer=own.answer;
  const locked=!!s.locked||!!s.revealed||s.round_open===false||(mode==='speed'&&!!own);
  let result='';
  if(s.revealed){
    if(own)result='<div class="result '+(own.is_correct?'':'wrong')+'">'+(mode==='speed'?(own.is_correct?'Deine Antwort wurde als erste richtige Antwort gewertet.':'Deine Abgabe wurde nicht als erste richtige Antwort gewertet.'):(own.is_correct?'Richtig!':'Diesmal nicht richtig.'))+' · '+(Number(own.awarded_points)||0)+' Punkte'+(q.type==='single'||q.type==='multiple'?'<div style="margin-top:5px">Die richtigen Antwort(en) sind grün markiert.</div>':'')+'</div>';
    else result='<div class="result wrong">Du hast keine Antwort abgegeben. Für diese Frage gibt es 0 Punkte.</div>';
  }else if(own)result='<div class="result">'+(mode==='speed'?'Verbindlich abgegeben. Die Antworten werden in Eingangsreihenfolge geprüft.':s.locked?'Antwortphase gesperrt. Deine gespeicherte Antwort bleibt erhalten.':'Antwort abgegeben. Du kannst sie bis zur Sperre noch ändern.')+'</div>';
  const timer=st.timer_deadline&&!s.locked&&!s.revealed?'<span class="timer" data-deadline="'+esc(st.timer_deadline)+'"></span>':'';
  main='<div class="panel"><div class="question-bar"><span>Frage '+(idx+1)+' von '+s.question_count+'</span><span>'+esc(q.points||0)+' Punkte</span>'+timer+'</div><h1>'+ (q.type==='pin'?(q.text?QuizRichText.render(q):'Setze deinen Pin auf die gesuchte Stelle.'):q.type==='ranking'?'Bringe die Elemente in die richtige Reihenfolge.':q.type==='truefalse'?'Wahr oder falsch?':q.type==='shortanswer'?'Trage deine Antwort ein.':'Wähle deine Antwort'+(q.type==='multiple'?'(n)':'')+'.')+'</h1>'+inputChoices(q,idx,locked,!!s.revealed,answer)+result+'<div class="row" style="margin-top:15px"><button id="submitAnswer" '+(locked||saveBusy?'disabled':'')+'>Antwort abgeben</button><span class="muted" style="font-size:.82rem">'+(s.round_open===false?'Warte auf die Freigabe.':s.revealed?'Antwortphase abgeschlossen.':mode==='speed'&&own?'Deine erste Abgabe zählt.':s.locked?'Antwortphase gesperrt.':own?'Du kannst deine Antwort noch ändern.':'Deine Antwort bleibt bis zur Abgabe auf diesem Gerät.')+'</span></div></div>';
  }
 }
 app.innerHTML='<div class="layout"><div class="main">'+main+'</div><aside class="side live-sidebar" tabindex="0" aria-label="Punktestand und dein Status"><div class="panel"><div class="eyebrow">Live-Ranking</div><h2>Rangliste</h2><div class="muted" style="font-size:.82rem;margin-bottom:11px">Die Punkte werden erst nach der Lösungsanzeige aktualisiert.</div>'+renderRanking(s.leaderboard||[])+'</div><div class="panel"><h2>Dein Status</h2><div class="row"><span class="status '+(s.own_response?'green':'')+'">'+(s.own_response?'Antwort gespeichert':'Noch keine Antwort')+'</span></div><p class="muted" style="font-size:.86rem;margin-bottom:0">Teilnahmecode: <strong>'+esc(joinCode)+'</strong></p></div></aside></div>';
 bindAnswerInputs(q,idx);
 const buzz=document.getElementById('buzzButton');if(buzz)buzz.onclick=submitBuzz;
 const submit=document.getElementById('submitAnswer');if(submit)submit.onclick=submitAnswer;
 updateTimerDisplay();
 if(focusId){const next=document.getElementById(focusId);if(next&&!next.disabled){next.focus({preventScroll:true});if(typeof start==='number'&&next.setSelectionRange)next.setSelectionRange(start,end);}}
}
function buzzerMarkup(s,q,idx){
 const own=s.own_response,disabled=s.round_open===false||s.locked||s.revealed||!!own||saveBusy;
 let status=s.round_open===false?'Warte auf die Freigabe durch die Lehrkraft.':own?'Dein Buzzer ist registriert. Antworte erst, wenn du aufgerufen wirst.':'Drücke, sobald du die Antwort weißt.';
 if(s.revealed)status=own?.is_correct?'Richtig! Du erhältst '+(Number(own.awarded_points)||0)+' Punkte.':'Die Runde ist abgeschlossen.';
 const time=own&&s.elapsed_ms!=null?'<p class="race-time">Eingang nach '+(Number(s.elapsed_ms)/1000).toLocaleString('de-DE',{minimumFractionDigits:3,maximumFractionDigits:3})+' s</p>':'';
 return '<div class="panel"><div class="question-bar"><span>Frage '+(idx+1)+' von '+s.question_count+'</span><span>'+esc(q.points||0)+' Punkte</span></div><h1>Buzzer</h1><p class="muted">'+status+'</p><button class="buzzer" id="buzzButton" '+(disabled?'disabled':'')+' aria-label="Buzzer drücken">'+(own?'✓':'BUZZ')+'</button>'+time+'</div>';
}
async function submitBuzz(){
 const s=studentState;if(!s||saveBusy||s.round_open===false||s.locked||s.revealed||s.own_response)return;
 if(!navigator.onLine){setConnectionStatus('error','Offline. Dein Buzzer wurde nicht übertragen.');return;}
 saveBusy=true;const button=document.getElementById('buzzButton');if(button)button.disabled=true;
 try{await rpc('quiz_live_submit_response_secure',{p_session_id:sessionId,p_participant_id:participantId,p_question_index:s.current_index,p_answer:{buzz:true},p_token:participantToken});await refreshState(true);}
 catch(error){setConnectionStatus('error','Buzzer nicht registriert. '+messageFor(error.message));}
 finally{saveBusy=false;render();}
}
function bindAnswerInputs(q,idx){
 if(q?.type==='pin')QuizPin.mount(app.querySelector('[data-quiz-pin]'),q,{answer:getAnswerDraft(q,idx),showTarget:!!studentState.revealed,editable:!studentState.locked&&!studentState.revealed&&studentState.round_open!==false,onChange:value=>{draftByQuestion[idx]=value;}});
 const root=app;const saveDraft=()=>{const cur=studentState.question;if(!cur)return;let val;
 if(q.type==='single'){const r=root.querySelector('input[name="studentAnswer"]:checked');val=r?r.value:null;}
 else if(q.type==='multiple'){val=Array.from(root.querySelectorAll('input[name="studentAnswer"]:checked')).map(el=>el.value);}
 else if(q.type==='truefalse'){const r=root.querySelector('input[name="studentAnswer"]:checked');val=r?r.value==='true':null;}
 else if(q.type==='shortanswer'){const t=root.querySelector('#shortAnswer');val=t?t.value:'';}
 else if(q.type==='ranking'){val=rankDraftByQuestion[idx]||(q.items||[]).map(x=>x.id);}
 draftByQuestion[idx]=val;
 };
 root.querySelectorAll('input[name="studentAnswer"],#shortAnswer').forEach(el=>{el.addEventListener('change',saveDraft);el.addEventListener('input',saveDraft);});
}
async function submitAnswer(){
 const s=studentState;if(!s||!s.question||s.locked||s.revealed||s.round_open===false||saveBusy||(s.play_mode==='speed'&&s.own_response))return;
 const q=s.question,idx=s.current_index;let answer=getAnswerDraft(q,idx);
 if(q.type==='shortanswer'){const input=document.getElementById('shortAnswer');answer=input?input.value.trim():String(answer||'');}
 if(q.type==='single'||q.type==='truefalse'){const selected=app.querySelector('input[name="studentAnswer"]:checked');if(selected)answer=q.type==='truefalse'?selected.value==='true':selected.value;}
 if(q.type==='multiple'){answer=Array.from(app.querySelectorAll('input[name="studentAnswer"]:checked')).map(el=>el.value);}
 if(q.type==='ranking'){answer=rankDraftByQuestion[idx]||(q.items||[]).map(x=>x.id);}
 const complete=q.type==='ranking'||q.type==='truefalse'?answer!==null&&answer!==undefined:q.type==='multiple'?Array.isArray(answer)&&answer.length>0:q.type==='shortanswer'?String(answer||'').trim().length>0:!!answer;
 if(!complete){alert('Bitte gib zuerst eine Antwort ein.');return;}
 if(!navigator.onLine){setConnectionStatus('error','Offline. Deine Antwort bleibt hier erhalten und wurde noch nicht gespeichert.');return;}
 setConnectionStatus('waiting','Antwort wird gespeichert …');saveBusy=true;const button=document.getElementById('submitAnswer');if(button)button.disabled=true;
 try{await rpc('quiz_live_submit_response_secure',{p_session_id:sessionId,p_participant_id:participantId,p_question_index:idx,p_answer:answer,p_token:participantToken});draftByQuestion[idx]=answer;setConnectionStatus('ready','Antwort gespeichert.');await refreshState(true);}
 catch(err){setConnectionStatus('error','Antwort nicht gespeichert. Deine Eingabe bleibt erhalten. '+messageFor(err.message));await refreshState(true);}
 finally{saveBusy=false;const b=document.getElementById('submitAnswer');if(b&&studentState&&!studentState.locked&&!studentState.revealed&&studentState.round_open!==false&&!(studentState.play_mode==='speed'&&studentState.own_response))b.disabled=false;}
}
function updateTimerDisplay(){const el=app.querySelector('[data-deadline]');if(!el)return;const deadline=el.dataset.deadline;const s=studentState;if(!deadline||s.locked||s.revealed){el.textContent='';return;}const secs=Math.max(0,Math.ceil((Date.parse(deadline)-Date.now())/1000));el.textContent=secs>0?'⏱ '+secs+' s':'⏱ Zeit abgelaufen';el.classList.toggle('expired',secs===0);}
async function refreshState(force){
 if(pollBusy||!sessionId||!participantId)return;pollBusy=true;
 try{
  const state=await rpc('quiz_live_student_state_secure',{p_session_id:sessionId,p_participant_id:participantId,p_token:participantToken});
  if(!saveBusy)setConnectionStatus('ready',state.own_response?'Verbunden · Antwort gespeichert.':'Verbunden · Deine Eingabe ist erst nach der Abgabe gespeichert.');
  leaderboard=state.leaderboard||[];
  const sig=stateSignature(state);
  if(force||sig!==lastRenderedKey){studentState=state;lastRenderedKey=sig;render();}
  else{studentState=state;}
 }catch(err){if(err.message==='SESSION_NOT_FOUND'){clearInterval(pollTimer);joinCode='';sessionId='';participantId='';app.innerHTML='<div class="panel"><h1>Teilnahme nicht verfügbar</h1><p class="notice">Diese Sitzung ist nicht mehr verfügbar. Bitte frage deine Lehrkraft nach einem neuen Code.</p><button onclick="location.reload()">Erneut versuchen</button></div>';}else setConnectionStatus('error','Verbindung unterbrochen. Deine Eingaben bleiben erhalten; wir versuchen es automatisch erneut.');}
 finally{pollBusy=false;}
}
window.addEventListener('online',()=>refreshState(true));
app.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action="rank-move"]');if(!b||!studentState||studentState.locked||studentState.revealed)return;
 const idx=Number(b.dataset.index),pos=Number(b.dataset.pos),dir=Number(b.dataset.dir),q=studentState.question;
 const arr=(rankDraftByQuestion[idx]||(q.items||[]).map(x=>x.id)).slice(),to=pos+dir;if(to<0||to>=arr.length)return;
 [arr[pos],arr[to]]=[arr[to],arr[pos]];rankDraftByQuestion[idx]=arr;draftByQuestion[idx]=arr;render();
});
(async function init(){
 const stored=loadStoredJoin();
 if(stored&&/^[a-f0-9]{64}$/.test(stored.participantToken||'')&&stored.participantName&&stored.joinCode&&(!PRESET_CODE||stored.joinCode===PRESET_CODE)){
  participantToken=stored.participantToken;
  try{await join(stored.joinCode,stored.participantName,stored.participantId);return;}catch(e){console.warn('Vorherige Teilnahme konnte nicht fortgesetzt werden.');}
 }
 joinView();
})();
</script>
