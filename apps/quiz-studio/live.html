px}.media-audio{width:min(100%,560px);height:44px}.answers-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer-board{padding:15px 16px;min-height:68px;border:1px solid var(--line);border-radius:13px;background:var(--soft);font-size:1rem;overflow-wrap:anywhere;white-space:pre-wrap}.answer-board.correct{border-color:var(--ok);background:var(--ok-soft);color:#245c41;font-weight:800}.correct-note{padding:12px 14px;margin:14px 0 0;background:var(--ok-soft);border:1px solid #b9d7c2;border-radius:12px;color:#245c41}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.timer-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.timer-box select{padding:9px 10px;background:white;border:1px solid var(--line);border-radius:9px}.timer{font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:900;color:var(--dark)}.timer.expired{color:var(--danger)}.board-status{padding:13px 15px;background:var(--soft);border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted)}.ranking-list{display:flex;flex-direction:column;gap:7px}.rank-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.rank-item.answered{border-color:#b4d8bf;background:var(--ok-soft)}.rank-num{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--muted-bg);font-size:.8rem;font-weight:900}.rank-name{font-weight:750;overflow-wrap:anywhere}.rank-score{font-weight:900;color:var(--dark);font-variant-numeric:tabular-nums;white-space:nowrap}.answer-count{font-size:.86rem;color:var(--muted);margin-top:10px}.responses{display:flex;flex-direction:column;gap:8px;margin-top:12px}.response-row{display:grid;grid-template-columns:minmax(120px,.7fr) minmax(0,2fr) auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:11px 12px}.response-row.correct{border-color:#b4d8bf;background:var(--ok-soft)}.response-row.wrong{border-color:#e3c2bc;background:var(--danger-soft)}.response-name{font-weight:800;overflow-wrap:anywhere}.response-answer{white-space:pre-wrap;overflow-wrap:anywhere}.response-points{font-weight:900;white-space:nowrap}.status-pill{display:inline-flex;padding:4px 9px;border-radius:999px;background:var(--muted-bg);font-weight:800;font-size:.78rem}.status-pill.green{background:var(--ok-soft);color:#245c41}.status-pill.red{background:var(--danger-soft);color:#8c3b38}.foot{color:var(--muted);text-align:center;padding:24px 0 8px;font-size:.82rem}.notice{padding:12px 14px;border-radius:12px;background:#f7efcf;color:#786126;border:1px solid #e7d7a6}.hidden{display:none!important}

<script>
'use strict';
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET='quiz-studio';
const app=document.getElementById('app');
const params=new URLSearchParams(location.search);
let user=null,session=null,participants=[],responses=[],serverLeaderboard=[],lastSignature='',refreshBusy=false,autoLockKey='',timerInterval=null,actionBusy=false,timerSeconds=30,actionError='';
const esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
const errText=function(e){return e&&e.message?e.message:String(e||'Unbekannter Fehler');};
function toast(message){const el=document.getElementById('saveStatus');if(el)el.textContent=message;}
async function rpc(name,args){const r=await db.rpc(name,args);if(r.error)throw r.error;const value=r.data;if(value&&value.ok===false)throw new Error(value.error||'Aktion fehlgeschlagen');return value;}
function qstate(){if(!session||!Array.isArray(session.question_states))return {};const i=session.current_index;return i>=0&&i<session.question_states.length?session.question_states[i]||{}:{};}
function activeQuestion(){const qs=session&&session.quiz_snapshot&&session.quiz_snapshot.questions;const i=session?session.current_index:-1;return Array.isArray(qs)&&i>=0&&i<qs.length?qs[i]:null;}
function displayMedia(media){if(!media||!media.data)return '';const src=esc(media.data);if(media.type==='image'&&/^data:image\//i.test(media.data))return '<img class="media" src="'+src+'" alt="Bild zur Frage">';if(media.type==='audio'&&/^data:audio\//i.test(media.data))return '<audio class="media media-audio" controls preload="metadata" src="'+src+'"></audio>';if(media.type==='video'&&/^data:video\//i.test(media.data))return '<video class="media" controls preload="metadata" src="'+src+'"></video>';return '';}
function choices(q){if(!q)return [];if(q.type==='single'||q.type==='multiple')return q.options||[];if(q.type==='truefalse')return [{id:'true',text:'Wahr',correct:q.correct===true},{id:'false',text:'Falsch',correct:q.correct===false}];if(q.type==='ranking')return q.items||[];return [];}
function responseText(q,a){if(q?.type==='pin')return QuizPin.point(a)?'Pin: '+a.x.toLocaleString('de-DE')+' % / '+a.y.toLocaleString('de-DE')+' %':'Kein Pin';if(a===null||a===undefined)return 'Keine Antwort';if(q.type==='single'){const o=(q.options||[]).find(x=>x.id===a);return o?o.text:'Antwort';}if(q.type==='multiple'){return Array.isArray(a)?a.map(id=>{const o=(q.options||[]).find(x=>x.id===id);return o?o.text:id;}).join(' · '):String(a);}if(q.type==='truefalse')return a===true?'Wahr':a===false?'Falsch':'Keine Antwort';if(q.type==='ranking')return Array.isArray(a)?a.map((id,i)=>{const o=(q.items||[]).find(x=>x.id===id);return (i+1)+'. '+(o?o.text:id);}).join(' → '):String(a);return String(a);}
function leaderboardRows(){return serverLeaderboard;}
function leaderboardMarkup(){
 const rows=leaderboardRows();
 if(!rows.length)return '<div class="board-status">Noch keine Schülerinnen oder Schüler beigetreten.</div>';
 return '<div class="ranking-list">'+rows.map((r,i)=>'<div class="rank-item '+(r.answered?'answered':'')+'"><span class="rank-num">'+(i+1)+'</span><span class="rank-name">'+esc(r.participant.name)+' '+(r.answered?'<span class="status-pill green">Antwort da</span>':'')+'</span><span class="rank-score">'+(Math.round(r.score*100)/100).toLocaleString('de-DE')+' P</span></div>').join('')+'</div>';
}
function joinUrl(){const u=new URL('../../join.html',location.href);u.search='';u.searchParams.set('code',session.join_code);u.searchParams.set('kind','quiz');return u.href;}
const joinDialog=document.getElementById('joinDialog');
function openJoin(){
 if(!session)return;
 document.getElementById('accessCode').textContent=session.join_code;
 const holder=document.getElementById('qrCode');holder.innerHTML='';
 const error=document.getElementById('qrError');error.classList.add('hidden');
 joinDialog.showModal();
 try{
  if(typeof window.QRCode!=='function')throw new Error('QR_UNAVAILABLE');
  new QRCode(holder,{text:joinUrl(),width:280,height:280,colorDark:'#172218',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  // qrcodejs adds a tooltip containing its payload; the dialog shows only the QR and code.
  holder.removeAttribute('title');
 }catch(e){error.classList.remove('hidden');}
}
document.getElementById('closeJoin').addEventListener('click',()=>joinDialog.close());
joinDialog.addEventListener('close',()=>document.querySelector('[data-action="access"]')?.focus());
joinDialog.addEventListener('click',e=>{if(e.target===joinDialog){const r=joinDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)joinDialog.close();}});
document.addEventListener('change',e=>{if(e.target.id==='timerSeconds')timerSeconds=Number(e.target.value);});
function clockIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>';}
function lockButton(){
 const st=qstate(),inactive=session.status!=='running'||!activeQuestion()||st.locked||st.revealed;
 return '<button class="secondary icon-button lock-button" data-action="lock" aria-label="Antworten sperren" title="'+(st.locked||st.revealed?'Antworten sind gesperrt':'Antworten sperren')+'" '+(inactive?'disabled':'')+'><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></svg></button>';
}
function raceMarkup(st){
 const rows=responses.filter(r=>r.question_index===session.current_index),active=rows.find(r=>r.id===st.active_response_id),q=activeQuestion();
 if(st.revealed)return '<p class="race-note">'+(st.winner_id?'Die erste richtige Antwort erhält die Punkte.':'Runde abgeschlossen – keine richtige Antwort bewertet.')+'</p>';
 if(!active)return '<p class="race-note">'+(st.locked?'Keine weiteren Eingänge. Du kannst die Lösung einblenden.':st.mode==='buzzer'?'Warte auf den nächsten Buzzer.':'Warte auf die nächste Antwort.')+'</p>';
 const person=participants.find(p=>p.id===active.participant_id);
 return '<section class="race-active" aria-label="Aktuelle Antwort"><h2>'+esc(person?.name||'Teilnehmende Person')+' ist dran</h2>'+(st.mode==='speed'?'<div class="race-answer">'+esc(responseText(q,active.answer))+'</div>':'<p>Antworte mündlich.</p>')+'<div class="race-actions"><button data-action="judge-wrong" data-response-id="'+esc(active.id)+'" class="danger">✕ Falsch</button><button data-action="judge-correct" data-response-id="'+esc(active.id)+'">✓ Richtig</button></div></section>';
}
function raceQueue(st){
 const rows=responses.filter(r=>r.question_index===session.current_index);
 return '<section class="panel race-panel" aria-label="Eingangsreihenfolge"><h2>'+ (st.mode==='buzzer'?'Buzzer-Reihenfolge':'Antwort-Reihenfolge')+'</h2><div class="race-list">'+(rows.map((r,i)=>{
  const person=participants.find(p=>p.id===r.participant_id),ms=Math.max(0,Date.parse(r.submitted_at)-Date.parse(st.opened_at));
  return '<div class="race-entry '+(r.id===st.active_response_id?'active ':'')+(st.winner_id===r.participant_id?'winner':'')+'"><span>'+(i+1)+'</span><strong>'+esc(person?.name||'Teilnehmende Person')+'</strong><span class="race-time">'+(ms/1000).toLocaleString('de-DE',{minimumFractionDigits:3,maximumFractionDigits:3})+' s</span></div>';
 }).join('')||'<div class="board-status">Noch keine Eingänge.</div>')+'</div></section>';
}
function questionToolbar(q,idx,count,st){
 const revealed=!!st.revealed,points=Number(q.points)||0;
 const durations=[[15,'15s'],[30,'30s'],[45,'45s'],[60,'60s'],[90,'90s'],[120,'2min'],[180,'3min']];
 return '<div class="question-toolbar"><div class="question-progress"><button class="secondary icon-button" data-action="back" aria-label="Vorherige Frage" title="Vorherige Frage" '+(idx===0?'disabled':'')+'>←</button><span>Frage '+(idx+1)+' von '+count+'</span></div>'+
 '<button class="reveal-button studio-primary" data-action="reveal" aria-label="'+(revealed?'Lösung eingeblendet':'Lösung einblenden')+' · '+points+' Punkte" title="'+(revealed?'Lösung eingeblendet':'Lösung einblenden')+'" '+(revealed?'disabled':'')+'><span>✓ '+(revealed?'Aufgelöst':'Lösung')+'</span><span class="question-points">'+esc(points)+' P</span></button>'+
 '<div class="timer-box"><select id="timerSeconds" aria-label="Timerdauer" '+(revealed||st.locked?'disabled':'')+'>'+durations.map(([value,label])=>'<option value="'+value+'" '+(value===timerSeconds?'selected':'')+'>'+label+'</option>').join('')+'</select><button class="secondary icon-button" data-action="timer" aria-label="Timer starten" title="Timer starten" '+(revealed||st.locked?'disabled':'')+'>'+clockIcon()+'</button><span class="timer" id="timerDisplay" role="timer" aria-live="off"></span></div>'+
 '<button class="secondary next-question" data-action="next" aria-label="'+(idx===count-1?'Quiz beenden':'Weiter zur nächsten Frage')+'" title="'+(idx===count-1?'Quiz beenden':'Nächste Frage')+'" '+(!revealed?'disabled':'')+'><span class="next-label">'+(idx===count-1?'Beenden':'Weiter')+'</span> '+(idx===count-1?'✓':'→')+'</button></div>';
}
function renderQuestion(){
 const q=activeQuestion();const idx=session.current_index;const st=qstate();const revealed=!!st.revealed;const count=session.quiz_snapshot.questions.length;
 if(session.status==='lobby')return '<div class="panel"><div class="eyebrow">Wartelobby</div><h1>'+esc(session.quiz_title)+'</h1><p class="lead">Die erste Frage ist noch verborgen. Warte, bis alle bereit sind, und starte dann das Quiz.</p><div class="board-status">Teilnehmende: '+participants.length+' · Alle Antworten und Punkte werden erst nach „Lösung einblenden“ ausgewertet.</div><div class="controls"><button data-action="start">▶ Quiz starten</button></div></div>';
 if(session.status==='ended'||idx>=count)return '<div class="panel"><div class="eyebrow">Quiz beendet</div><h1>'+esc(session.quiz_title)+'</h1><p class="lead">Das Quiz ist abgeschlossen. Die Rangliste enthält die endgültigen Punktstände.</p>'+leaderboardMarkup()+'<div class="controls"><button class="danger end-quiz" data-action="end-quiz">Beenden</button></div></div>';
 if(!q)return '<div class="panel"><div class="board-status">Frage wird geladen …</div></div>';
 const options=choices(q);
 let body='';
 if(options.length){
  body='<div class="answers-board">'+options.map(o=>'<div class="answer-board '+(revealed&&o.correct?'correct':'')+'">'+QuizRichText.render(o)+(revealed&&o.correct?' ✓':'')+'</div>').join('')+'</div>';
  if(revealed&&q.type==='ranking')body='<div class="answers-board">'+(q.items||[]).map((o,i)=>'<div class="answer-board">'+(i+1)+'. '+QuizRichText.render(o)+'</div>').join('')+'</div>';
  if(revealed&&q.type==='truefalse')body='<div class="correct-note">Lösung: '+(q.correct?'Wahr':'Falsch')+'</div>';
 }else if(q.type==='shortanswer'&&revealed){body='<div class="correct-note">Akzeptierte Antworten: '+esc((q.answers||[]).join(' · '))+'</div>';}
 if(q.type==='pin')body=QuizPin.markup(q,{showTarget:revealed,markers:revealed?responses.filter(r=>r.question_index===idx).map(r=>({id:r.participant_id,name:participants.find(p=>p.id===r.participant_id)?.name||'Teilnehmende Person',answer:r.answer})):[]});
 const media=q.type==='pin'?'':displayMedia(q.media);
 const answerRows=revealed&&(!st.mode||st.mode==='classic')?responses.filter(r=>r.question_index===idx).map(r=>{
   const person=participants.find(p=>p.id===r.participant_id);const ok=!!r.is_correct;
   return '<div class="response-row '+(ok?'correct':'wrong')+'"><span class="response-name">'+esc(person?person.name:'Teilnehmende Person')+'</span><span class="response-answer">'+esc(responseText(q,r.answer))+'</span><span class="response-points">'+(ok?'+'+(Number(r.awarded_points)||0):'0')+' P</span></div>';
 }).join(''):'';
 return '<div class="panel question-panel">'+questionToolbar(q,idx,count,st)+'<div class="question-text">'+QuizRichText.render(q)+'</div>'+media+body+(st.mode&&st.mode!=='classic'?raceMarkup(st):'')+'<div class="answer-count">'+responses.filter(r=>r.question_index===idx).length+' von '+participants.length+' haben geantwortet</div>'+(revealed&&(!st.mode||st.mode==='classic')?'<h2 style="margin-top:22px">Antworten der Schülerinnen und Schüler</h2><div class="responses">'+(answerRows||'<div class="board-status">Noch keine Antworten eingegangen.</div>')+'</div>':'')+'</div>';
}
function render(){
 if(!session){app.innerHTML='<div class="panel">Live-Quiz wird geladen …</div>';return;}
 const st=qstate();const q=activeQuestion();
 const phase=session.status==='lobby'?'Wartelobby':session.status==='ended'?'Beendet':'Live';
 app.innerHTML='<header class="studio-header"><div class="studio-identity"><span class="studio-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="24" rx="4"/><path d="m11 12 2 2 3-4m3 3h3m-11 8 2 2 3-4m3 3h3"/></svg></span><div><h1 class="studio-title">Quiz <span>Studio</span></h1><div class="studio-subtitle">Live-Quiz · '+esc(phase)+'</div></div></div><div class="studio-actions"><span class="status-pill">'+participants.length+' Teilnehmende</span><button class="secondary" data-action="access" aria-haspopup="dialog">Teilnahme</button><button class="danger end-quiz" data-action="end-quiz">Beenden</button></div></header>'+(actionError?'<p class="notice" role="alert">'+esc(actionError)+'</p>':'')+'<div class="layout"><div class="main-col">'+renderQuestion()+'</div><aside class="side-col live-sidebar" tabindex="0" aria-label="Punktestand und Spielstatus">'+(st.mode&&st.mode!=='classic'?raceQueue(st):'')+'<div class="panel ranking-panel"><div class="ranking-heading"><div><div class="eyebrow">Live-Ranking</div><h2>Rangliste</h2></div>'+lockButton()+'</div><div id="leaderboard">'+leaderboardMarkup()+'</div><div class="answer-count">Grün markiert bedeutet: Antwort abgegeben.</div></div></aside></div>';
 if(q?.type==='pin')QuizPin.mount(app.querySelector('[data-quiz-pin]'),q,{showTarget:!!st.revealed});
 updateTimer();
}
async function loadSession(){
 const r=await db.from('quiz_live_sessions').select('*').eq('id',params.get('session')).single();
 if(r.error)throw r.error;
 if(r.data.owner_id!==user.id)throw new Error('Diese Sitzung gehört nicht deinem Lehrerkonto.');
 session=r.data;
}
async function createFromQuiz(quizId){
 const store=createLibraryStore(db,'quiz');const library=await store.load(user);
 if(!library)throw new Error('Noch keine Quizbibliothek gespeichert.');
 const source=(library.quizzes||[]).find(q=>q.id===quizId);
 const quiz=source?{...source,rules_version:1,questions:source.questions.map(q=>({...q,playMode:q.type==='pin'?'classic':QuizModes.normalise(q.playMode)}))}:null;
 if(!quiz)throw new Error('Quiz nicht gefunden. Prüfe, ob es bereits in der Cloud gespeichert wurde.');
 if(!quiz.questions||!quiz.questions.length)throw new Error('Dieses Quiz enthält noch keine Fragen.');
 const created=await rpc('quiz_live_create',{p_quiz:quiz});
 session={id:created.session_id,owner_id:user.id,quiz_title:created.title,quiz_snapshot:quiz,status:'lobby',join_code:created.join_code,current_index:-1,question_states:quiz.questions.map(q=>({mode:QuizModes.normalise(q.playMode),opened_at:null,locked:false,revealed:false,timer_seconds:null,timer_deadline:null})),updated_at:new Date().toISOString()};
 history.replaceState(null,'',location.pathname+'?session='+encodeURIComponent(session.id));
}
async function refresh(force){
 if(refreshBusy||!session)return;refreshBusy=true;
 try{
  const state=await rpc('quiz_live_teacher_state',{p_session_id:session.id});
  session={...session,...state.session};serverLeaderboard=state.leaderboard||[];
  participants=serverLeaderboard.map(r=>r.participant);responses=state.responses||[];
  const sig=[session.updated_at,session.status,session.current_index,JSON.stringify(session.question_states),JSON.stringify(serverLeaderboard),responses.map(x=>x.id+':'+x.submitted_at+':'+x.awarded_points+':'+x.is_correct).join('|')].join('~');
  if(force||sig!==lastSignature){lastSignature=sig;render();}
  setConnectionStatus('ready','Verbunden · Sitzungsstand aktualisiert.');
  toast('Cloud verbunden · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setConnectionStatus('error','Verbindung unterbrochen. Der letzte bestätigte Stand bleibt sichtbar; wir versuchen es automatisch erneut.');toast('Live-Quiz: '+errText(e));}
 finally{refreshBusy=false;}
}
async function act(name,args){await rpc(name,args);lastSignature='';await refresh(true);}
async function updateTimer(){
 const el=document.getElementById('timerDisplay');if(!el||!session)return;
 const st=qstate();const deadline=st.timer_deadline;
 if(!deadline||st.revealed||st.locked){el.textContent='';el.classList.remove('expired');return;}
 const secs=Math.max(0,Math.ceil((new Date(deadline).getTime()-Date.now())/1000));
 el.textContent=secs>0?secs+'s':'0s';el.classList.toggle('expired',secs===0);

}
window.addEventListener('online',()=>refresh(true));
document.body.addEventListener('click',async function(e){
 const el=e.target.closest('[data-action]');if(!el)return;
 const action=el.dataset.action;if(action==='access'){openJoin();return;}if(actionBusy)return;actionBusy=true;actionError='';const observedIndex=session?.current_index;app.querySelectorAll('button[data-action]').forEach(b=>b.disabled=true);el.disabled=true;
 try{
  if(action==='start'){await act('quiz_live_start',{p_session_id:session.id});}
  else if(action==='judge-correct'||action==='judge-wrong'){await act('quiz_live_judge_entry',{p_session_id:session.id,p_question_index:observedIndex,p_response_id:el.dataset.responseId,p_correct:action==='judge-correct'});}
  else if(action==='back'){if(session.current_index>0)await act('quiz_live_navigate_from',{p_session_id:session.id,p_target_index:observedIndex-1,p_expected_index:observedIndex});}
  else if(action==='next'){const count=session.quiz_snapshot.questions.length;await act('quiz_live_navigate_from',{p_session_id:session.id,p_target_index:observedIndex+1,p_expected_index:observedIndex});}
  else if(action==='timer'){const seconds=Number(document.getElementById('timerSeconds').value);await act('quiz_live_start_timer_at',{p_session_id:session.id,p_seconds:seconds,p_question_index:observedIndex});}
  else if(action==='lock'){await act('quiz_live_lock_question',{p_session_id:session.id,p_question_index:session.current_index});}
  else if(action==='reveal'){await act('quiz_live_reveal_question',{p_session_id:session.id,p_question_index:session.current_index});}
  else if(action==='end-quiz'){await rpc('quiz_live_end',{p_session_id:session.id});clearInterval(timerInterval);location.href='index.html';}
 }catch(err){actionError=err.message==='STATE_CHANGED'?'Die Frage wurde inzwischen gewechselt. Bitte prüfe die aktuelle Ansicht.':'Aktion fehlgeschlagen: '+errText(err);toast(actionError);}
 finally{actionBusy=false;lastSignature='';await refresh(true);}
});
(async function init(){
 try{
  const auth=await db.auth.getUser();if(auth.error||!auth.data.user){location.href='../../login.html?next=apps%2Fquiz-studio%2Findex.html';return;}user=auth.data.user;
  if(params.get('session')){await loadSession();if(session.status==='running'&&session.quiz_snapshot?.rules_version===1)await rpc('quiz_live_start',{p_session_id:session.id});}
  else if(params.get('quiz')){await createFromQuiz(params.get('quiz'));}
  else throw new Error('Es wurde kein Quiz ausgewählt.');
  await refresh(true);let polledAt=0;timerInterval=setInterval(function(){updateTimer();const interval=qstate().mode&&qstate().mode!=='classic'?500:1500;if(!document.hidden&&Date.now()-polledAt>=interval){polledAt=Date.now();refresh(false);}},250);
 }catch(e){app.innerHTML='<div class="panel"><h1>Live-Quiz konnte nicht gestartet werden</h1><p class="notice">'+esc(errText(e))+'</p><button onclick="location.href=\'index.html\'">Zum Quiz Studio</button></div>';toast(errText(e));}
})();
</script>
</body>
</html>
