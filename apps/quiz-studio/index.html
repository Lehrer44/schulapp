<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Studio · SchulApp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme: light;
  --bg:#f3f1e9;
  --surface:#fffefa;
  --surface-soft:#faf8f1;
  --surface-muted:#eeeadd;
  --line:#d9d2c2;
  --line-strong:#b9ad93;
  --text:#34352e;
  --muted:#777668;
  --accent:#88784f;
  --accent-dark:#665a3d;
  --accent-soft:#eee7d5;
  --board:#f8f4e9;
  --board-hover:#eee5d1;
  --danger:#b9504e;
  --danger-soft:#f8e8e5;
  --ok:#36795d;
  --ok-soft:#e5f1e8;
  --primary:#88784f;
  --primary-600:#665a3d;
  --primary-soft:#eee7d5;
  --shadow:0 14px 36px rgba(69,59,37,.07);
  --shadow-soft:0 5px 16px rgba(69,59,37,.06);
  --radius:21px;
  --radius-sm:15px;
  --radius-btn:11px;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,"Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse at 8% 0%,rgba(255,255,255,.88),transparent 38rem),
             linear-gradient(145deg,#f5f3ed 0%,var(--bg) 58%,#ebe7dc 100%);
  color:var(--text);
  min-height:100vh;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid transparent;border-radius:var(--radius-btn);padding:.72rem 1rem;background:var(--accent-dark);color:#fffdf7;font-weight:700;box-shadow:0 2px 4px rgba(49,42,29,.05);transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease}
button:hover:not(:disabled){background:#554a32;box-shadow:0 5px 12px rgba(49,42,29,.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{cursor:not-allowed;opacity:.5;box-shadow:none;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex="0"]:focus-visible{outline:3px solid #b6a26a;outline-offset:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent-dark);border-color:var(--accent-dark);color:#fffdf7}
.btn.primary:hover:not(:disabled){background:#554a32;border-color:#554a32}
.btn.secondary,.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.secondary:hover:not(:disabled),.btn.ghost:hover:not(:disabled){background:var(--surface-muted);border-color:var(--line-strong);color:var(--text);box-shadow:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fffdf7}
.btn.danger:hover:not(:disabled){background:#9f3e3d;border-color:#9f3e3d}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#fffdf7}
.btn.gold:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.small{padding:.48rem .8rem;font-size:.86rem;border-radius:9px}
.btn.big{padding:.9rem 1.6rem;font-size:1rem;width:100%;border-radius:13px}

.icon-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  width:34px;height:34px;border-radius:9px;padding:0;font-size:.95rem;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:none;flex:none;
}
.icon-btn:hover:not(:disabled){background:var(--surface-muted);color:var(--text);border-color:var(--line-strong);transform:none;box-shadow:none}
.icon-btn.danger:hover:not(:disabled){background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}

.muted{color:var(--muted)}
.small{font-size:13px}
.spacer{flex:1}

.wrap{width:100%;max-width:1500px;margin:0 auto;padding:clamp(16px,3vw,38px)}

/* ---------- Top bar ---------- */
.top{
  display:flex;justify-content:space-between;gap:18px;align-items:center;
  margin-bottom:24px;padding:20px 22px;
  background:rgba(255,254,250,.82);
  border:1px solid rgba(217,210,194,.95);
  border-radius:22px;
  box-shadow:var(--shadow-soft);
  backdrop-filter:blur(12px);
  flex-wrap:wrap;
}
.brand-lockup{display:flex;align-items:center;gap:13px;min-width:0}
.brand-symbol{
  width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;
  border-radius:15px;background:var(--accent-dark);color:#fffdf7;
  font-size:1.45rem;font-weight:900;letter-spacing:-.06em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
.brand{font-size:1.16rem;font-weight:850;letter-spacing:-.035em;line-height:1.2;overflow-wrap:anywhere}
.brand span{color:var(--accent);font-weight:700}
.brand-sub{font-size:.82rem;color:var(--muted);margin-top:4px}

.hero-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Panels ---------- */
.panel{
  background:rgba(255,254,250,.91);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:clamp(16px,2.2vw,26px);
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.panel h2{font-size:1.32rem;letter-spacing:-.025em;margin:0 0 8px;font-weight:800}
.panel-lead{margin:0;color:var(--muted);max-width:58ch;font-size:.94rem;line-height:1.55}
.eyebrow{font-size:.72rem;letter-spacing:.14em;font-weight:850;color:var(--accent);margin:0 0 7px;text-transform:uppercase}
.library-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.library-count{
  padding:8px 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface-soft);color:var(--muted);
  font-size:.8rem;font-weight:750;
}

/* ---------- Quiz cards ---------- */
.grid{display:flex;flex-direction:column;gap:10px}
.qzcard{
  min-width:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;
  background:linear-gradient(160deg,#fffefa,var(--surface-soft));
  border:1px solid var(--line);border-radius:15px;
  padding:15px 17px;box-shadow:var(--shadow-soft);
  transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.qzcard:hover{border-color:var(--line-strong);box-shadow:0 8px 20px rgba(69,59,37,.07);transform:translateY(-1px)}
.qzcard .quiz-info{grid-column:1;min-width:0}
.qzcard .quiz-info h3{font-size:1.03rem;letter-spacing:-.02em;margin:0 0 4px;overflow-wrap:anywhere}
.qzcard .quiz-info .muted{font-size:.9rem;line-height:1.5}
.qzcard .card-actions{grid-column:2;grid-row:1;justify-content:flex-end;align-self:center;margin:0;padding:0}
.qzcard .order-actions{display:flex;gap:5px;margin-right:3px}
.qzcard .order-button{padding:.55rem .7rem;min-width:38px;background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:none;font-size:.95rem}
.qzcard .order-button:hover:not(:disabled){background:var(--surface-muted);border-color:var(--line-strong)}
.card-actions{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.card-actions .btn.small{padding:.42rem .75rem;font-size:.82rem}
.empty{text-align:center;padding:48px 20px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:14px;background:rgba(250,248,241,.6)}
.question-media-editor{margin:10px 0 2px;padding:12px;background:var(--surface-soft);border:1px solid var(--line);border-radius:12px}
.media-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.media-upload-label{position:relative;overflow:hidden;cursor:pointer}
.media-upload-label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.media-paste-hint{font-size:.82rem;color:var(--muted);line-height:1.5;margin-top:8px}
.media-preview-editor{display:block;max-width:100%;max-height:220px;margin:12px 0 0;border:1px solid var(--line);border-radius:10px;background:#fffefa;object-fit:contain}
audio.media-preview-editor{width:min(100%,560px);height:42px}
video.media-preview-editor{width:auto;max-width:100%;max-height:220px}
.question-media-play{display:block;max-width:100%;max-height:320px;margin:0 auto 18px;border-radius:12px;object-fit:contain}
audio.question-media-play{width:min(100%,560px);height:42px}
video.question-media-play{width:auto;max-width:100%;max-height:320px}

/* ---------- Editor ---------- */
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}

.title-input{
  width:100%;border:none;background:transparent;color:var(--text);
  font-size:1.55rem;font-weight:800;padding:0 0 8px;outline:none;font-family:inherit;
  letter-spacing:-.03em;border-bottom:2px solid transparent;
}
.title-input:focus{border-bottom-color:var(--accent)}
.title-input::placeholder{color:var(--muted);font-weight:600}
.desc-input{
  width:100%;border:none;background:transparent;color:var(--muted);resize:vertical;
  font-size:.94rem;padding:6px 0;outline:none;font-family:inherit;min-height:38px;
}
.settings-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:7px;font-size:.9rem;cursor:pointer;user-select:none;font-weight:600;color:var(--text)}
.check input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.meta{margin-top:12px;font-size:.84rem;color:var(--muted);font-weight:600}

.qcard{margin:0 0 14px;padding:18px 20px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{
  background:var(--accent-soft);color:var(--accent-dark);
  font-size:.72rem;font-weight:800;padding:5px 11px;border-radius:999px;white-space:nowrap;
  letter-spacing:.02em;
}
.qnum{font-size:.82rem;color:var(--muted);font-weight:700}
.points{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);font-weight:700}
.points input{
  width:64px;border:1px solid var(--line);border-radius:9px;background:#fffefa;
  color:var(--text);padding:5px 8px;font-size:.84rem;font-family:inherit;outline:none;
  font-weight:700;text-align:center;
}
.points input:focus{border-color:var(--accent)}
.qtext{
  width:100%;border:1px solid var(--line);border-radius:11px;background:#fffefa;
  color:var(--text);padding:12px 14px;font-size:.98rem;font-family:inherit;resize:vertical;
  outline:none;min-height:52px;line-height:1.5;
}
.qtext:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(136,120,79,.12)}
.qbody{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.hint{font-size:.84rem;color:var(--muted);line-height:1.5}
.opt-row{display:flex;align-items:center;gap:8px}
.opt-row input[type=radio],.opt-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:none}
.opt-text{
  flex:1;border:1px solid var(--line);border-radius:10px;background:#fffefa;
  color:var(--text);padding:9px 12px;font-size:.92rem;font-family:inherit;outline:none;min-width:0;
}
.opt-text:focus{border-color:var(--accent)}
.rank-row{display:flex;align-items:center;gap:8px}
.rank-num{
  width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);
  display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:900;flex:none;
}
.add-panel{text-align:center}
.add-label{font-size:.78rem;color:var(--muted);margin-bottom:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.add-buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.add-buttons .btn{background:var(--surface);border:1px solid var(--line);color:var(--text);font-weight:700}
.add-buttons .btn:hover:not(:disabled){background:var(--surface-muted);border-color:var(--line-strong)}
.tf{display:flex;gap:10px}
.tf label{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;
  border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:700;font-size:.94rem;
  background:#fffefa;transition:.15s;
}
.tf label:hover{border-color:var(--line-strong);background:var(--surface-soft)}
.tf label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark)}
.tf input{accent-color:var(--accent);width:17px;height:17px}

/* ---------- Play ---------- */
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:20px}
.progress-bar{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.play-score{font-size:.94rem;font-weight:800;color:var(--accent-dark);padding:6px 12px;background:var(--accent-soft);border-radius:999px}
.play-panel{padding:clamp(22px,3vw,32px)}
.play-meta{font-size:.78rem;color:var(--muted);font-weight:800;margin-bottom:12px;letter-spacing:.08em;text-transform:uppercase}
.play-question{font-size:clamp(1.35rem,2.6vw,1.85rem);margin:0 0 22px;line-height:1.35;letter-spacing:-.02em;font-weight:800}
.play-options{display:flex;flex-direction:column;gap:10px}
.play-opt{
  display:flex;align-items:center;gap:12px;padding:15px 17px;border:1.5px solid var(--line);
  border-radius:13px;cursor:pointer;background:#fffefa;transition:.15s;font-size:.98rem;font-weight:600;
}
.play-opt:hover{border-color:var(--line-strong);background:var(--surface-soft)}
.play-opt input{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.play-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.play-opt.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.play-opt.is-wrong{border-color:var(--danger);background:var(--danger-soft)}
.rank-play{display:flex;flex-direction:column;gap:8px}
.rank-play-row{
  display:flex;align-items:center;gap:10px;padding:12px 15px;border:1.5px solid var(--line);
  border-radius:12px;background:#fffefa;transition:.15s;
}
.rank-play-row.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.rank-play-row.is-wrong{border-color:var(--danger);background:var(--danger-soft)}
.rank-text{flex:1;font-size:.98rem;font-weight:600}
.short-input{
  width:100%;border:1.5px solid var(--line);border-radius:13px;background:#fffefa;
  color:var(--text);padding:15px 17px;font-size:1rem;font-family:inherit;outline:none;
}
.short-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(136,120,79,.12)}
.play-actions{margin-top:22px}
.feedback{margin-top:20px;padding:16px 18px;border-radius:13px;font-size:.94rem;border:1.5px solid;line-height:1.5}
.feedback.ok{background:var(--ok-soft);border-color:var(--ok);color:#286347}
.feedback.partial{background:#f7efcf;border-color:#d7c087;color:#786126}
.feedback.bad{background:var(--danger-soft);border-color:var(--danger);color:#8e3837}
.fb-title{font-weight:800}
.fb-correct{margin-top:8px;color:var(--text);opacity:.92}
.fb-correct strong{font-weight:800}

/* ---------- Result ---------- */
.result-hero{text-align:center;padding:38px 22px}
.result-pct{font-size:clamp(3rem,8vw,4.2rem);font-weight:900;letter-spacing:-.045em;line-height:1;color:var(--accent-dark)}
.result-msg{font-size:1.25rem;font-weight:800;margin-top:12px;letter-spacing:-.02em}
.result-sub{color:var(--muted);margin-top:8px;font-size:.94rem}
.review{margin-bottom:12px;padding:16px 18px;border-left:4px solid var(--line);border-radius:13px}
.review.ok{border-left-color:var(--ok)}
.review.partial{border-left-color:#d7c087}
.review.bad{border-left-color:var(--danger)}
.rev-head{display:flex;gap:12px;align-items:flex-start;font-weight:700;font-size:.98rem}
.rev-num{
  width:26px;height:26px;border-radius:50%;background:var(--surface-muted);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:.78rem;flex:none;margin-top:1px;font-weight:800;
}
.rev-q{flex:1;line-height:1.4}
.rev-pts{font-size:.82rem;color:var(--muted);white-space:nowrap;font-weight:800;padding-top:4px}
.rev-row{margin-top:8px;font-size:.9rem;padding-left:38px;line-height:1.5}
.rev-label{color:var(--muted);font-weight:700;margin-right:6px}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
  background:#34352e;color:#fffdf7;padding:13px 20px;border-radius:13px;
  font-size:.92rem;font-weight:700;opacity:0;pointer-events:none;
  transition:.25s;z-index:999;max-width:min(420px,calc(100vw - 32px));
  box-shadow:0 12px 32px rgba(0,0,0,.18);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.footer-note{text-align:center;color:var(--muted);font-size:.8rem;margin-top:36px;padding-bottom:20px}

@media(max-width:760px){
  .top{flex-direction:column;align-items:flex-start;padding:17px}
  .hero-actions{width:100%}
  .hero-actions .btn{flex:1}
  .grid{display:flex;flex-direction:column}
  .qzcard{grid-template-columns:1fr;align-items:stretch}
  .qzcard .card-actions{grid-column:1;grid-row:auto;justify-content:flex-start;flex-wrap:wrap;padding-top:10px}
  .qzcard .quiz-info{min-width:0}
  .title-input{font-size:1.28rem}
  .qhead{gap:6px}
}
@media(max-width:440px){
  .brand-symbol{width:42px;height:42px;flex-basis:42px;border-radius:13px;font-size:1.25rem}
  .brand{font-size:1.03rem}
  .brand-sub{font-size:.78rem}
  .rev-row{padding-left:0}
  .rev-pts{padding-top:0}
  .tf{flex-direction:column}
}
</style>

<script>
/* =========================================================
   Quiz Studio – v1 (Jeopardy Layout)
   ========================================================= */

/* ---------- Konstanten ---------- */
const LEGACY_LS_KEY = 'quizstudio.v1';
const SUPABASE_URL = 'https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const QUIZ_STORAGE_BUCKET = 'quiz-studio';
const MAX_CLOUD_FILE_SIZE = 50 * 1024 * 1024;
const cloudClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TYPES = {
  single:      { label:'Einfachauswahl', icon:'◉' },
  multiple:    { label:'Mehrfachauswahl', icon:'☑' },
  truefalse:   { label:'Wahr / Falsch',  icon:'⚖' },
  ranking:     { label:'Ranking',        icon:'↕' },
  shortanswer: { label:'Kurzantwort',    icon:'✎' }
};

/* ---------- State ---------- */
let db = { quizzes: [] };
let state = { view:'list', draft:null, session:null };
let saveTimer = null;
const MAX_MEDIA_SIZE = 5 * 1024 * 1024;
let indexedDbPromise = null;
const libraryStore=createLibraryStore(cloudClient,'quiz');
let cloudDirty=false;
let cloudUser = null;
let cloudReady = false;
let cloudSaveQueue = Promise.resolve();
let mediaRecoveryWarning = false;

/* ---------- Helpers ---------- */
const $app = document.getElementById('app');

function uid(){
  return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmt(n){
  const x = Number(n) || 0;
  if(Number.isInteger(x)) return String(x);
  return x.toFixed(2).replace(/0+$/,'').replace(/\.$/,'').replace('.',',');
}
function slug(s){
  return String(s||'quiz').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'quiz';
}
function moveInArray(arr, idx, dir){
  const j = idx + dir;
  if(j < 0 || j >= arr.length) return false;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  return true;
}
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------- Cloud-Persistenz ---------- */
function setCloudStatus(message){
  const el = document.getElementById('cloudStatus');
  if(el) el.textContent = 'Quiz Studio · ' + message;
  setConnectionStatus(/fehlgeschlagen|Nicht gespeichert|konflikt|Fehler/i.test(message)?'error':/Verbinde|Lade|Speichere|Ungespeicherte|Übernehme|Nicht gespeichert/i.test(message)?'waiting':'ready',message);
}
function isMissingCloudFile(error){
  const status = String(error && (error.statusCode || error.status) || '');
  const message = String(error && error.message || '');
  return status === '404' || /not found|does not exist|no such object|object not found/i.test(message);
}
function cloudFilePath(){
  if(!cloudUser) throw new Error('Du bist nicht angemeldet.');
  return cloudUser.id + '/Quiz-Studio.json';
}
function openLegacyDatabase(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('Keine alte lokale Datenbank vorhanden.'));
  if(!indexedDbPromise){
    indexedDbPromise = new Promise((resolve,reject)=>{
      const request = indexedDB.open('quizstudio-local-data',1);
      request.onupgradeneeded = ()=>{
        const idb = request.result;
        if(!idb.objectStoreNames.contains('state')) idb.createObjectStore('state');
      };
      request.onsuccess = ()=>resolve(request.result);
      request.onerror = ()=>reject(request.error || new Error('Alte lokale Datenbank konnte nicht geöffnet werden.'));
    });
  }
  return indexedDbPromise;
}
async function readLegacyLocalState(){
  // Nur für die einmalige Übernahme vorhandener Quizze, falls es noch keine Cloud-Datei gibt.
  try{
    const idb = await openLegacyDatabase();
    const indexed = await new Promise((resolve,reject)=>{
      const tx = idb.transaction('state','readonly');
      const request = tx.objectStore('state').get('quizzes');
      request.onsuccess = ()=>resolve(request.result || null);
      request.onerror = ()=>reject(request.error || new Error('Alte Quizdaten konnten nicht gelesen werden.'));
    });
    if(indexed && Array.isArray(indexed.quizzes)){
      delete indexed.__quizStudioSavedAt;
      return indexed;
    }
  }catch(e){ console.info('Keine übernehmbaren Quizdaten in der alten Browserdatenbank.'); }

  try{
    const raw = localStorage.getItem(LEGACY_LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.quizzes)){
        delete parsed.__quizStudioSavedAt;
        (parsed.quizzes || []).forEach(quiz=>(quiz.questions || []).forEach(question=>{
          if(question.media && question.media.storedInIndexedDB && !question.media.data){
            question.media = null;
            mediaRecoveryWarning = true;
          }
        }));
        return parsed;
      }
    }
  }catch(e){ console.warn('Alte Quiz-Sicherung konnte nicht übernommen werden.',e); }
  return null;
}
function cleanupLegacyLocalState(){
  try{ localStorage.removeItem(LEGACY_LS_KEY); }catch(e){}
  try{
    if(indexedDbPromise){
      indexedDbPromise.then(idb=>idb.close()).catch(()=>{});
      indexedDbPromise = null;
    }
    if('indexedDB' in window) indexedDB.deleteDatabase('quizstudio-local-data');
  }catch(e){ console.info('Alte Browserdatenbank konnte nicht entfernt werden.'); }
}
async function load(){
  setCloudStatus('Verbinde mit Supabase …');
  const {data:authData,error:authError} = await cloudClient.auth.getUser();
  if(authError || !authData || !authData.user){
    window.location.href = '../../login.html?next=apps%2Fquiz-studio%2Findex.html';
    return false;
  }
  cloudUser = authData.user;
  const path = cloudFilePath();
  setCloudStatus('Lade Quizbibliothek aus der Cloud …');

  const parsed=await libraryStore.load(cloudUser);
  if(parsed){
    if(!Array.isArray(parsed.quizzes))throw new Error('Ungültige Quizbibliothek.');
    db=parsed;cloudReady=true;cleanupLegacyLocalState();setCloudStatus('Mit Supabase synchronisiert');return true;
  }

  // Beim ersten Cloud-Start lokale Altbestände einmalig übernehmen und danach lokal entfernen.
  const legacy = await readLegacyLocalState();
  db = legacy && Array.isArray(legacy.quizzes) ? legacy : {quizzes:[]};
  cloudReady = true;
  if(db.quizzes.length){
    setCloudStatus('Übernehme vorhandene Quizze in die Cloud …');
    const migrated = await save();
    if(!migrated) {
      cloudReady = false;
      throw new Error('Die vorhandenen Quizze konnten nicht in die Cloud übernommen werden. Die lokale Sicherung wurde beibehalten.');
    }
    cleanupLegacyLocalState();
    toast('Vorhandene Quizze wurden in dein Supabase-Konto übernommen');
  }else{
    setCloudStatus('Cloud-Speicherung bereit');
  }
  return true;
}
function save(){
  clearTimeout(saveTimer);saveTimer=null;
  if(!cloudReady || !cloudUser){
    setCloudStatus('Nicht gespeichert – keine Cloud-Verbindung');
    return Promise.resolve(false);
  }
  cloudDirty=true;
  const snapshot = deepCopy(db);
  const blob = new Blob([JSON.stringify(snapshot)],{type:'application/json;charset=utf-8'});
  if(blob.size > MAX_CLOUD_FILE_SIZE){
    const sizeMB = (blob.size/1024/1024).toFixed(1);
    toast('Cloud-Speicherung nicht möglich: Quizbibliothek ist '+sizeMB+' MB groß (Limit 50 MB). Bitte Medien verkleinern.');
    setCloudStatus('Speicherung fehlgeschlagen – Cloud-Datei zu groß');
    return Promise.resolve(false);
  }
  setCloudStatus('Speichere in Supabase …');
  cloudSaveQueue = cloudSaveQueue.catch(()=>{}).then(async()=>{
    await libraryStore.save(snapshot);
    cloudDirty=JSON.stringify(db)!==JSON.stringify(snapshot);
    setCloudStatus('Cloud gespeichert · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    return true;
  }).catch(error=>{
    console.error('Cloud-Speicherung fehlgeschlagen',error);
    setCloudStatus(error.code==='LIBRARY_CONFLICT'?'Speicherkonflikt: Änderungen sichern, dann neu laden.':'Nicht gespeichert – bitte Verbindung prüfen und erneut speichern.');
    toast(error.code==='LIBRARY_CONFLICT'?'Ein anderer Tab hat die Bibliothek geändert. Deine Änderungen bleiben hier erhalten. Exportiere eine Sicherung und lade dann neu.':'Nicht gespeichert. Deine Änderungen bleiben hier erhalten. Bitte erneut speichern.');
    return false;
  });
  return cloudSaveQueue;
}
function scheduleSave(){
  clearTimeout(saveTimer);
  cloudDirty=true;setCloudStatus('Ungespeicherte Änderungen');
  saveTimer = setTimeout(()=>{saveTimer=null;save();},800);
}

window.addEventListener('beforeunload',e=>{if(cloudDirty||saveTimer||libraryStore.unsaved){e.preventDefault();e.returnValue='';}});

/* ---------- Quiz / Fragen erzeugen ---------- */
function newQuiz(){
  return {
    id: uid(),
    title: 'Neues Quiz',
    description: '',
    shuffleQuestions: false,
    shuffleAnswers: false,
    immediateFeedback: true,
    questions: [],
    createdAt: Date.now()
  };
}
function createQuestion(type){
  const base = { id: uid(), type, text: '', points: 1 };
  if(type === 'single' || type === 'multiple'){
    return { ...base, options: [
      { id: uid(), text: '', correct: false },
      { id: uid(), text: '', correct: false }
    ]};
  }
  if(type === 'truefalse') return { ...base, correct: true };
  if(type === 'ranking'){
    return { ...base, items: [
      { id: uid(), text: '' },
      { id: uid(), text: '' },
      { id: uid(), text: '' }
    ]};
  }
  if(type === 'shortanswer') return { ...base, answers: [''] };
  return base;
}

let renderedEditorId = null;
function render(){
  // Keep the working position when rebuilding the same quiz editor.
  // Entering another quiz or switching views still starts at the top.
  const editorId = state.view === 'editor' ? state.draft?.id : null;
  const keepPosition = editorId !== null && editorId === renderedEditorId;
  const position = {left:window.scrollX,top:window.scrollY};
  document.body.dataset.dashboardView=state.view==='list'?'library':state.view==='editor'?'editor':'preview';
  if(state.view === 'list')        $app.innerHTML = viewList();
  else if(state.view === 'editor') $app.innerHTML = viewEditor();
  else if(state.view === 'play')   $app.innerHTML = viewPlay();
  else if(state.view === 'result') $app.innerHTML = viewResult();
  renderedEditorId = editorId;
  window.scrollTo({left:keepPosition?position.left:0,top:keepPosition?position.top:0,behavior:'instant'});
}

function mediaMarkup(media, className){
  if(!media || typeof media.data !== 'string' || !media.data) return '';
  const src = esc(media.data);
  if(media.type === 'image' && /^data:image\//i.test(media.data)){
    return `<img class="${className}" src="${src}" alt="${esc(media.name || 'Bild zur Frage')}">`;
  }
  if(media.type === 'audio' && /^data:audio\//i.test(media.data)){
    return `<audio class="${className}" controls preload="metadata" src="${src}">Dein Browser unterstützt die Audiowiedergabe nicht.</audio>`;
  }
  if(media.type === 'video' && /^data:video\//i.test(media.data)){
    return `<video class="${className}" controls preload="metadata" src="${src}">Dein Browser unterstützt die Videowiedergabe nicht.</video>`;
  }
  return '';
}

/* ---------- Spielen ---------- */
function initAnswer(q){
  switch(q.type){
    case 'single':      return null;
    case 'multiple':    return [];
    case 'truefalse':   return null;
    case 'ranking':     return q.items.map(i=>i.id);
    case 'shortanswer': return '';
  }
  return null;
}
function isAnswered(q, ans){
  switch(q.type){
    case 'single':      return !!ans;
    case 'multiple':    return Array.isArray(ans) && ans.length > 0;
    case 'truefalse':   return ans === true || ans === false;
    case 'ranking':     return true;
    case 'shortanswer': return String(ans||'').trim().length > 0;
  }
  return false;
}

function startPlay(quizId){
  const quiz = db.quizzes.find(q=>q.id === quizId);
  if(!quiz){ toast('Quiz nicht gefunden.'); return; }
  if(quiz.questions.length === 0){ toast('Dieses Quiz hat noch keine Fragen.'); return; }

  const questions = quiz.questions.map(q=>{
    const c = deepCopy(q);
    if((c.type === 'single' || c.type === 'multiple') && quiz.shuffleAnswers) shuffle(c.options);
    if(c.type === 'ranking'){
      c.correctOrder = c.items.map(i=>i.id);
      shuffle(c.items);
    }
    return c;
  });
  if(quiz.shuffleQuestions) shuffle(questions);

  state.session = {
    quizId,
    title: quiz.title,
    questions,
    answers: questions.map(q=>initAnswer(q)),
    results: new Array(questions.length).fill(null),
    index: 0,
    checked: false,
    immediate: quiz.immediateFeedback !== false
  };
  state.view = 'play';
  render();
}

function viewPlay(){
  const s = state.session;
  if(!s) return '';
  const q = s.questions[s.index];
  const ans = s.answers[s.index];
  const res = s.results[s.index];
  const total = s.questions.length;
  const pct = Math.round((s.index / total) * 100);
  const score = s.results.reduce((a,r)=>a + (r ? r.score : 0), 0);

  let btnLabel;
  if(s.checked) btnLabel = (s.index === total-1) ? 'Ergebnis anzeigen' : 'Weiter →';
  else btnLabel = s.immediate ? 'Antwort prüfen' : 'Weiter →';

  return `
  <header class="studio-header">
    <div class="studio-identity"><span class="studio-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="24" rx="4"/><path d="m11 12 2 2 3-4m3 3h3m-11 8 2 2 3-4m3 3h3"/></svg></span><div><h1 class="studio-title">Quiz <span>Studio</span></h1><div class="studio-subtitle">Frage ${s.index+1} von ${total}</div></div></div>
    <div class="studio-actions">
      <div class="play-score">${fmt(score)} Punkte</div>
      <button class="btn secondary" data-action="quit-play">✕ Beenden</button>
    </div>
  </header>
  <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>

  <div class="panel play-panel">
    <div class="play-meta">Frage ${s.index+1} von ${total} · ${fmt(q.points)} ${Number(q.points)===1?'Punkt':'Punkte'}</div>
    <h2 class="play-question">${(q.text ? QuizRichText.render(q) : '') || '<em class="muted">Keine Frage formuliert</em>'}</h2>
    ${mediaMarkup(q.media,'question-media-play')}
    ${playBody(q, ans, s.checked)}
    ${(s.checked && s.immediate) ? feedbackBox(q, res) : ''}
    <div class="play-actions">
      <button id="primaryBtn" class="btn primary big" data-action="primary"
        ${(!s.checked && !isAnswered(q, ans)) ? 'disabled' : ''}>${btnLabel}</button>
    </div>
  </div>`;
}

function playBody(q, ans, checked){
  const dis = checked ? 'disabled' : '';

  if(q.type === 'single'){
    return `<div class="play-options">${q.options.map(o=>{
      const sel = ans === o.id;
      const cls = checked ? (o.correct ? 'is-correct' : (sel ? 'is-wrong' : '')) : '';
      return `<label class="play-opt ${cls}">
        <input type="radio" name="play_${q.id}" value="${o.id}" ${sel?'checked':''} ${dis}
               data-pfield="single" data-oid="${o.id}">
        <span>${QuizRichText.render(o)}</span>
      </label>`;
    }).join('')}</div>`;
  }

  if(q.type === 'multiple'){
    return `<div class="play-options">${q.options.map(o=>{
      const sel = Array.isArray(ans) && ans.includes(o.id);
      const cls = checked ? (o.correct ? 'is-correct' : (sel ? 'is-wrong' : '')) : '';
      return `<label class="play-opt ${cls}">
        <input type="checkbox" value="${o.id}" ${sel?'checked':''} ${dis}
               data-pfield="multiple" data-oid="${o.id}">
        <span>${QuizRichText.render(o)}</span>
      </label>`;
    }).join('')}</div>`;
  }

  if(q.type === 'truefalse'){
    return `<div class="play-options">
      ${[true,false].map(v=>{
        const sel = ans === v;
        const cls = checked ? (q.correct === v ? 'is-correct' : (sel ? 'is-wrong' : '')) : '';
        return `<label class="play-opt ${cls}">
          <input type="radio" name="play_${q.id}" value="${v}" ${sel?'checked':''} ${dis}
                 data-pfield="tf">
          <span>${v ? 'Wahr' : 'Falsch'}</span>
        </label>`;
      }).join('')}
    </div>`;
  }

  if(q.type === 'ranking'){
    const order = ans || [];
    const correctOrder = q.correctOrder || q.items.map(i=>i.id);
    const byId = Object.fromEntries(q.items.map(i=>[i.id, i]));
    return `<div class="rank-play">
      ${order.map((id,i)=>{
        const cls = checked ? (correctOrder[i] === id ? 'is-correct' : 'is-wrong') : '';
        return `<div class="rank-play-row ${cls}">
          <span class="rank-num">${i+1}</span>
          <span class="rank-text">${QuizRichText.render(byId[id] || {text:''})}</span>
          <button class="icon-btn" data-action="play-rank" data-dir="-1" data-idx="${i}" ${dis}>↑</button>
          <button class="icon-btn" data-action="play-rank" data-dir="1" data-idx="${i}" ${dis}>↓</button>
        </div>`;
      }).join('')}
    </div>`;
  }

  if(q.type === 'shortanswer'){
    return `<input class="short-input" type="text" placeholder="Deine Antwort …" value="${esc(ans)}"
             ${dis} data-pfield="shortanswer" autocomplete="off">`;
  }

  return '';
}

function feedbackBox(q, res){
  if(!res) return '';
  const cls = res.ok ? 'ok' : (res.score > 0 ? 'partial' : 'bad');
  const title = res.ok ? 'Richtig!' : (res.score > 0 ? 'Teilweise richtig' : 'Leider falsch');
  return `<div class="feedback ${cls}">
    <div class="fb-title">${title} · ${fmt(res.score)} / ${fmt(res.max)} Punkte</div>
    ${ !res.ok ? `<div class="fb-correct">Richtige Antwort: <strong>${esc(formatCorrect(q))}</strong></div>` : '' }
  </div>`;
}

/* ---------- Auswertung ---------- */
function evaluate(q, ans){
  const max = Number(q.points) || 0;

  if(q.type === 'single'){
    const correctId = (q.options.find(o=>o.correct) || {}).id ?? null;
    const ok = correctId !== null && ans === correctId;
    return { ok, score: ok ? max : 0, max };
  }

  if(q.type === 'multiple'){
    const correctIds = q.options.filter(o=>o.correct).map(o=>o.id).sort();
    const given = [...(ans || [])].sort();
    const ok = correctIds.length > 0 && correctIds.length === given.length &&
               correctIds.every((v,i)=>v === given[i]);
    return { ok, score: ok ? max : 0, max };
  }

  if(q.type === 'truefalse'){
    const ok = ans === q.correct;
    return { ok, score: ok ? max : 0, max };
  }

  if(q.type === 'ranking'){
    const correctOrder = q.correctOrder || q.items.map(i=>i.id);
    const given = ans || [];
    let hits = 0;
    correctOrder.forEach((id,i)=>{ if(given[i] === id) hits++; });
    const ratio = correctOrder.length ? hits / correctOrder.length : 0;
    const score = Math.round(max * ratio * 100) / 100;
    return { ok: hits === correctOrder.length && correctOrder.length > 0, score, max };
  }

  if(q.type === 'shortanswer'){
    const norm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g,' ');
    const ok = (q.answers || []).some(a => norm(a) !== '' && norm(a) === norm(ans));
    return { ok, score: ok ? max : 0, max };
  }

  return { ok:false, score:0, max };
}

function formatCorrect(q){
  if(q.type === 'single'){
    const o = q.options.find(o=>o.correct);
    return o ? o.text : '—';
  }
  if(q.type === 'multiple'){
    const t = q.options.filter(o=>o.correct).map(o=>o.text).filter(Boolean);
    return t.length ? t.join(', ') : '—';
  }
  if(q.type === 'truefalse') return q.correct ? 'Wahr' : 'Falsch';
  if(q.type === 'ranking'){
    const order = q.correctOrder || q.items.map(i=>i.id);
    const byId = Object.fromEntries(q.items.map(i=>[i.id, i]));
    return order.map(id=>byId[id]).join(' → ');
  }
  if(q.type === 'shortanswer'){
    const t = (q.answers || []).filter(a=>String(a).trim());
    return t.length ? t.join(' / ') : '—';
  }
  return '—';
}

function formatGiven(q, ans){
  if(q.type === 'single'){
    const o = q.options.find(o=>o.id === ans);
    return o && o.text ? o.text : (o ? '(leer)' : '— keine Antwort —');
  }
  if(q.type === 'multiple'){
    const ids = ans || [];
    const t = q.options.filter(o=>ids.includes(o.id)).map(o=>o.text).filter(Boolean);
    return t.length ? t.join(', ') : '— keine Antwort —';
  }
  if(q.type === 'truefalse'){
    return ans === true ? 'Wahr' : (ans === false ? 'Falsch' : '— keine Antwort —');
  }
  if(q.type === 'ranking'){
    const byId = Object.fromEntries(q.items.map(i=>[i.id, i]));
    const t = (ans || []).map(id=>byId[id]).filter(Boolean);
    return t.length ? t.join(' → ') : '—';
  }
  if(q.type === 'shortanswer'){
    const t = String(ans || '').trim();
    return t || '— keine Antwort —';
  }
  return '—';
}

/* ---------- Ergebnis ---------- */
function viewResult(){
  const s = state.session;
  if(!s) return '';
  const score = s.results.reduce((a,r)=>a + (r ? r.score : 0), 0);
  const max = s.results.reduce((a,r)=>a + (r ? r.max : 0), 0);
  const pct = max > 0 ? Math.round((score / max) * 100) : 0;
  const msg = pct >= 90 ? 'Hervorragend! 🏆'
            : pct >= 70 ? 'Sehr gut! 🎉'
            : pct >= 50 ? 'Solide Leistung 👍'
            : 'Weiter üben 💪';

  return `
  <header class="studio-header">
    <div class="studio-identity"><span class="studio-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="24" rx="4"/><path d="m11 12 2 2 3-4m3 3h3m-11 8 2 2 3-4m3 3h3"/></svg></span><div><h1 class="studio-title">Quiz <span>Studio</span></h1><div class="studio-subtitle">Ergebnis</div></div></div>
    <div class="studio-actions">
      <button class="btn secondary" data-action="back-to-list">← Zur Übersicht</button>
      <button class="btn gold" data-action="restart-quiz">↻ Nochmal spielen</button>
    </div>
  </header>

  <div class="panel result-hero">
    <div class="result-pct">${pct}%</div>
    <div class="result-msg">${msg}</div>
    <div class="result-sub">${fmt(score)} von ${fmt(max)} Punkten · ${s.questions.length} ${s.questions.length===1?'Frage':'Fragen'}</div>
  </div>

  <div class="panel">
    <div class="eyebrow">Auswertung</div>
    <h2>Alle Fragen im Überblick</h2>
    <div style="margin-top:16px">
    ${s.questions.map((q,i)=>{
      const r = s.results[i] || { ok:false, score:0, max:Number(q.points)||0 };
      const cls = r.ok ? 'ok' : (r.score > 0 ? 'partial' : 'bad');
      return `<div class="review ${cls}">
        <div class="rev-head">
          <span class="rev-num">${i+1}</span>
          <span class="rev-q">${(q.text ? QuizRichText.render(q) : '') || '<em class="muted">Keine Frage formuliert</em>'}</span>
          <span class="rev-pts">${fmt(r.score)} / ${fmt(r.max)}</span>
        </div>
        <div class="rev-row"><span class="rev-label">Deine Antwort:</span>${esc(formatGiven(q, s.answers[i]))}</div>
        ${ !r.ok ? `<div class="rev-row"><span class="rev-label">Richtig:</span>${esc(formatCorrect(q))}</div>` : '' }
      </div>`;
    }).join('')}
    </div>
  </div>`;
}

/* ---------- Klicks ---------- */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id  = el.dataset.id;
  const qid = el.dataset.qid;
  const oid = el.dataset.oid;
  const iid = el.dataset.iid;
  const aid = el.dataset.aid;
  const dir = Number(el.dataset.dir || 0);
  const draft = state.draft;
  const findQ = () => draft ? draft.questions.find(x=>x.id === qid) : null;

  switch(action){
    case 'retry-cloud-save': { await save(); break; }

    case 'new-quiz': {
      const q = newQuiz();
      db.quizzes.unshift(q);
      save();
      state.draft = q;
      state.view = 'editor';
      render();
      break;
    }
    case 'open-quiz': {
      const q = db.quizzes.find(x=>x.id === id);
      if(q){ state.draft = q; state.view = 'editor'; render(); }
      break;
    }
    case 'quiz-up':
    case 'quiz-down': {
      const idx = db.quizzes.findIndex(x=>x.id === id);
      if(idx >= 0 && moveInArray(db.quizzes, idx, action === 'quiz-up' ? -1 : 1)){
        save();
        render();
        toast('Reihenfolge geändert');
      }
      break;
    }
    case 'remove-question-media': {
      const q = findQ();
      if(q){
        q.media = null;
        save();
        render();
        toast('Medien aus der Frage entfernt');
      }
      break;
    }
    case 'live-quiz': {
      clearTimeout(saveTimer);if(await save())window.location.href = 'live.html?quiz=' + encodeURIComponent(id);
      break;
    }
    case 'play-quiz': {
      startPlay(id);
      break;
    }
    case 'dup-quiz': {
      const q = db.quizzes.find(x=>x.id === id);
      if(!q) break;
      const copy = deepCopy(q);
      copy.id = uid();
      copy.title = q.title + ' (Kopie)';
      copy.questions.forEach(question=>{
        question.id = uid();
        if(question.options) question.options.forEach(o=>o.id = uid());
        if(question.items)   question.items.forEach(i=>i.id = uid());
      });
      const idx = db.quizzes.findIndex(x=>x.id === id);
      db.quizzes.splice(idx + 1, 0, copy);
      save(); render();
      toast('Quiz dupliziert');
      break;
    }
    case 'del-quiz': {
      const q = db.quizzes.find(x=>x.id === id);
      if(!q) break;
      if(confirm(`Quiz "${q.title}" wirklich löschen?`)){
        db.quizzes = db.quizzes.filter(x=>x.id !== id);
        if(state.draft && state.draft.id === id) state.draft = null;
        save(); render();
        toast('Quiz gelöscht');
      }
      break;
    }
    case 'export-quiz': {
      const q = db.quizzes.find(x=>x.id === id);
      if(!q) break;
      download(slug(q.title) + '.json', JSON.stringify(q, null, 2));
      break;
    }
    case 'export-all': {
      if(db.quizzes.length === 0){ toast('Keine Quizze zum Exportieren.'); break; }
      download('quizstudio-backup.json', JSON.stringify(db, null, 2));
      break;
    }
    case 'import': {
      importData();
      break;
    }

    case 'back-to-list': {
      save();
      state.view = 'list';
      state.draft = null;
      state.session = null;
      render();
      break;
    }
    case 'add-question': {
      if(!draft) break;
      draft.questions.push(createQuestion(el.dataset.type));
      save(); render();
      break;
    }
    case 'del-question': {
      if(!draft) break;
      const idx = draft.questions.findIndex(x=>x.id === qid);
      if(idx < 0) break;
      if(confirm('Diese Frage löschen?')){
        draft.questions.splice(idx,1);
        save(); render();
      }
      break;
    }
    case 'move-question': {
      if(!draft) break;
      const idx = draft.questions.findIndex(x=>x.id === qid);
      if(idx < 0) break;
      if(moveInArray(draft.questions, idx, dir)){ save(); render(); }
      break;
    }
    case 'add-option': {
      const q = findQ();
      if(!q) break;
      q.options.push({ id: uid(), text:'', correct:false });
      save(); render();
      break;
    }
    case 'del-option': {
      const q = findQ();
      if(!q) break;
      if(q.options.length <= 2){ toast('Mindestens zwei Antworten nötig.'); break; }
      q.options = q.options.filter(o=>o.id !== oid);
      save(); render();
      break;
    }
    case 'add-item': {
      const q = findQ();
      if(!q) break;
      q.items.push({ id: uid(), text:'' });
      save(); render();
      break;
    }
    case 'del-item': {
      const q = findQ();
      if(!q) break;
      if(q.items.length <= 2){ toast('Mindestens zwei Elemente nötig.'); break; }
      q.items = q.items.filter(i=>i.id !== iid);
      save(); render();
      break;
    }
    case 'move-item': {
      const q = findQ();
      if(!q) break;
      const idx = q.items.findIndex(i=>i.id === iid);
      if(idx < 0) break;
      if(moveInArray(q.items, idx, dir)){ save(); render(); }
      break;
    }
    case 'add-answer': {
      const q = findQ();
      if(!q) break;
      q.answers.push('');
      save(); render();
      break;
    }
    case 'del-answer': {
      const q = findQ();
      if(!q) break;
      if(q.answers.length <= 1){ toast('Mindestens eine Antwort nötig.'); break; }
      q.answers.splice(Number(aid), 1);
      save(); render();
      break;
    }

    case 'play-rank': {
      const s = state.session;
      if(!s || s.checked) break;
      const arr = s.answers[s.index];
      const i = Number(el.dataset.idx);
      if(moveInArray(arr, i, dir)) render();
      break;
    }
    case 'primary': {
      const s = state.session;
      if(!s) break;
      if(s.checked){
        advance();
      } else {
        s.results[s.index] = evaluate(s.questions[s.index], s.answers[s.index]);
        if(s.immediate){ s.checked = true; render(); }
        else { advance(); }
      }
      break;
    }
    case 'quit-play': {
      if(confirm('Spiel wirklich beenden? Der Fortschritt geht verloren.')){
        state.session = null;
        state.view = 'list';
        render();
      }
      break;
    }
    case 'restart-quiz': {
      const s = state.session;
      if(s) startPlay(s.quizId);
      break;
    }
  }
});

function advance(){
  const s = state.session;
  if(!s) return;
  if(s.index >= s.questions.length - 1){
    state.view = 'result';
  } else {
    s.index++;
    s.checked = false;
  }
  render();
}

document.addEventListener('input', (e)=>{
  const t = e.target.closest('.rich-input') || e.target;
  if(state.view === 'editor') editorInput(t);
  else if(state.view === 'play') playInput(t);
});

/* ---------- Medien in Fragen ---------- */
function clipboardImageFile(clipboard){
  // Clipboard formats differ between screenshots, browsers and office applications.
  const files = [...Array.from(clipboard.files || []), ...Array.from(clipboard.items || [])
    .filter(item=>item.kind === 'file').map(item=>item.getAsFile()).filter(Boolean)];
  const image = files.find(file=>/^image\//i.test(file.type || ''));
  if(image) return image;

  // Some applications provide an embedded image only in text/html. Inspect it in
  // an inert template; never insert clipboard HTML or fetch external image URLs.
  const html = clipboard.getData('text/html');
  if(!html) return null;
  const template = document.createElement('template');
  template.innerHTML = html;
  for(const image of template.content.querySelectorAll('img[src]')){
    const match = image.getAttribute('src').match(/^data:(image\/(?:png|jpeg|gif|webp|avif|bmp));base64,([a-z0-9+/=\s]+)$/i);
    if(!match) continue;
    try{
      const bytes = Uint8Array.from(atob(match[2].replace(/\s/g,'')),char=>char.charCodeAt(0));
      return new File([bytes],'clipboard-image.'+match[1].split('/')[1],{type:match[1]});
    }catch(error){ /* Invalid image data falls back to plain-text paste. */ }
  }
  return null;
}
document.addEventListener('paste', (event)=>{
  const target = event.target.nodeType === 1 ? event.target : event.target.parentElement;
  const input = target?.closest('.rich-input.qtext');
  if(state.view !== 'editor' || !input || event.defaultPrevented) return;
  const clipboard = event.clipboardData;
  if(!clipboard) return;
  const imageFile = clipboardImageFile(clipboard);
  if(!imageFile) return;
  event.preventDefault();

  const qid = input.dataset.qid;
  const sourceQuiz = state.draft;
  const question = sourceQuiz && sourceQuiz.questions.find(item=>item.id === qid);
  if(!question) return;

  const plainText = clipboard.getData('text/plain');
  if(plainText) document.execCommand('insertText',false,plainText);
  Object.assign(question,QuizRichText.read(input));

  if(imageFile.size > MAX_MEDIA_SIZE){
    save();
    toast('Das kopierte Bild ist '+(imageFile.size/1024/1024).toFixed(1)+' MB groß. Bitte kopiere ein kleineres Bild (max. 5 MB), wie bei Jeopardy.');
    return;
  }

  const reader = new FileReader();
  reader.onload = ()=>{
    const data = String(reader.result || '');
    if(!data.startsWith('data:image/')){
      toast('Das eingefügte Element wurde nicht als Bild erkannt.');
      return;
    }
    const ext = (imageFile.type.split('/')[1] || 'png').replace('jpeg','jpg').replace(/[^a-z0-9]/gi,'');
    if(!sourceQuiz.questions.includes(question)) return;
    question.media = {type:'image',data,name:imageFile.name || ('clipboard-image.'+ext)};
    save();
    if(state.view === 'editor' && state.draft === sourceQuiz) render();
    toast('Bild eingefügt und der Frage zugeordnet');
  };
  reader.onerror = ()=>toast('Das kopierte Bild konnte nicht gelesen werden. Bitte füge es erneut ein.');
  reader.readAsDataURL(imageFile);
}, {capture:true});

document.addEventListener('change', (event)=>{
  const input = event.target;
  if(!input.matches('input[data-media-input]')) return;
  if(state.view !== 'editor' || !state.draft) return;
  const file = input.files && input.files[0];
  if(!file) return;
  const question = state.draft.questions.find(item=>item.id === input.dataset.qid);
  if(!question) return;

  const type = file.type.startsWith('image/') ? 'image'
             : file.type.startsWith('audio/') ? 'audio'
             : file.type.startsWith('video/') ? 'video' : '';
  if(!type){
    toast('Bitte wähle eine Bild-, Audio- oder Videodatei aus.');
    input.value = '';
    return;
  }
  if(file.size > MAX_MEDIA_SIZE && !confirm('Die Datei ist '+(file.size/1024/1024).toFixed(1)+' MB groß. Das vergrößert auch die Quiz-Sicherung. Möchtest du die Datei trotzdem einfügen?')){
    input.value = '';
    return;
  }

  const questionInput=input.closest('.qcard')?.querySelector('.rich-input.qtext');
  if(questionInput)Object.assign(question,QuizRichText.read(questionInput));
  const reader = new FileReader();
  reader.onload = ()=>{
    const data = String(reader.result || '');
    if(!data.startsWith('data:'+type+'/')){
      toast('Die ausgewählte Datei konnte nicht als unterstütztes Medium gelesen werden.');
      return;
    }
    question.media = {type,data,name:file.name || type};
    save();
    render();
    toast(type === 'image' ? 'Bild zur Frage hinzugefügt' : type === 'audio' ? 'Audio zur Frage hinzugefügt' : 'Video zur Frage hinzugefügt');
  };
  reader.onerror = ()=>toast('Die Datei konnte nicht gelesen werden.');
  reader.readAsDataURL(file);
});

function editorInput(t){
  const quiz = state.draft;
  if(!quiz) return;

  if(t.dataset.bind){
    const key = t.dataset.bind;
    quiz[key] = (t.type === 'checkbox') ? t.checked : t.value;
    scheduleSave();
    return;
  }

  const qid = t.dataset.qid;
  if(!qid) return;
  const q = quiz.questions.find(x=>x.id === qid);
  if(!q) return;
  const field = t.dataset.field;

  if(field === 'text'){
    Object.assign(q,QuizRichText.read(t));
  }
  else if(field === 'points'){
    const v = Number(t.value);
    q.points = isNaN(v) ? 0 : Math.max(0, v);
  }
  else if(field === 'option-text'){
    const o = q.options.find(o=>o.id === t.dataset.oid);
    if(o) Object.assign(o,QuizRichText.read(t));
  }
  else if(field === 'correct'){
    if(q.type === 'single'){
      q.options.forEach(o => o.correct = (o.id === t.dataset.oid));
    } else {
      const o = q.options.find(o=>o.id === t.dataset.oid);
      if(o) o.correct = t.checked;
    }
  }
  else if(field === 'tf'){
    q.correct = (t.value === 'true');
  }
  else if(field === 'item-text'){
    const it = q.items.find(i=>i.id === t.dataset.iid);
    if(it) Object.assign(it,QuizRichText.read(t));
  }
  else if(field === 'answer-text'){
    q.answers[Number(t.dataset.aid)] = t.value;
  }

  scheduleSave();
}

function playInput(t){
  const s = state.session;
  if(!s) return;
  const q = s.questions[s.index];
  const field = t.dataset.pfield;
  if(!field) return;

  if(field === 'single'){
    s.answers[s.index] = t.value;
  }
  else if(field === 'multiple'){
    const set = new Set(s.answers[s.index] || []);
    if(t.checked) set.add(t.value); else set.delete(t.value);
    s.answers[s.index] = [...set];
  }
  else if(field === 'tf'){
    s.answers[s.index] = (t.value === 'true');
  }
  else if(field === 'shortanswer'){
    s.answers[s.index] = t.value;
  }

  updatePrimaryBtn();
}

function updatePrimaryBtn(){
  const s = state.session;
  if(!s || state.view !== 'play') return;
  const btn = document.getElementById('primaryBtn');
  if(!btn) return;
  const q = s.questions[s.index];
  btn.disabled = !s.checked && !isAnswered(q, s.answers[s.index]);
}

/* ---------- Import / Export ---------- */
function download(filename, text){
  const blob = new Blob([text], { type:'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function importData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        const list = Array.isArray(data) ? data
                   : (data && Array.isArray(data.quizzes)) ? data.quizzes
                   : [data];
        let n = 0;
        list.forEach(q=>{
          if(!q || !Array.isArray(q.questions)) return;
          q.id = uid();
          q.questions.forEach(question=>{
            question.id = uid();
            if(Array.isArray(question.options)) question.options.forEach(o=>o.id = uid());
            if(Array.isArray(question.items))   question.items.forEach(i=>i.id = uid());
          });
          if(typeof q.title !== 'string') q.title = 'Importiertes Quiz';
          if(typeof q.description !== 'string') q.description = '';
          if(q.immediateFeedback === undefined) q.immediateFeedback = true;
          db.quizzes.unshift(q);
          n++;
        });
        save(); render();
        toast(n > 0 ? `${n} Quiz importiert` : 'Keine gültigen Quizze gefunden');
      }catch(err){
        toast('Import fehlgeschlagen: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
  input.click();
}

   Start

(async function startQuizStudio(){
  try{
    const ready = await load();
    if(!ready) return;
    if(db.quizzes.length === 0){
      const demo = newQuiz();
      demo.title = 'Willkommen bei Quiz Studio';
      demo.description = 'Ein kleines Beispiel-Quiz – du kannst es bearbeiten oder löschen.';

      const q1 = createQuestion('single');
      q1.text = 'Welche dieser Sprachen läuft direkt im Browser?';
      q1.points = 1;
      q1.options = [
        { id: uid(), text:'JavaScript', correct:true },
        { id: uid(), text:'Python',     correct:false },
        { id: uid(), text:'Java',       correct:false },
        { id: uid(), text:'C#',         correct:false }
      ];

      const q2 = createQuestion('multiple');
      q2.text = 'Welche Aussagen über HTML sind korrekt?';
      q2.points = 2;
      q2.options = [
        { id: uid(), text:'HTML beschreibt die Struktur einer Seite', correct:true },
        { id: uid(), text:'HTML ist eine Programmiersprache',         correct:false },
        { id: uid(), text:'HTML besteht aus Elementen/Tags',          correct:true },
        { id: uid(), text:'HTML ersetzt CSS vollständig',             correct:false }
      ];

      const q3 = createQuestion('ranking');
      q3.text = 'Bringe die Schritte des Wasserzyklus in die richtige Reihenfolge.';
      q3.points = 3;
      q3.items = [
        { id: uid(), text:'Verdunstung' },
        { id: uid(), text:'Kondensation' },
        { id: uid(), text:'Niederschlag' }
      ];

      const q4 = createQuestion('shortanswer');
      q4.text = 'Wie heißt die zentrale Speicher-API des Browsers für kleine Datenmengen?';
      q4.points = 1;
      q4.answers = ['localStorage', 'local storage', 'web storage'];

      demo.questions = [q1, q2, q3, q4];
      db.quizzes.push(demo);
      const saved = await save();
      if(!saved) throw new Error('Das Startquiz konnte nicht in der Cloud gespeichert werden.');
    }
    render();
    if(mediaRecoveryWarning) toast('Einige alte Medien konnten nicht wiederhergestellt werden. Bitte füge sie erneut hinzu.');
  }catch(error){
    console.error('Quiz Studio konnte nicht gestartet werden',error);
    setCloudStatus('Fehler beim Laden der Cloud-Daten');
    toast(error.message || 'Quiz Studio konnte nicht geladen werden.');
  }
})();
