<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umfrage Studio · SchulApp</title>
<link rel="stylesheet" href="../../shared/tokens.css?v=compact-2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f1efe6;--line:#93856a;--text:#5c5547;--muted:#90836b;--accent:#918469;--accent-dark:#6e624e;--danger:#ef726b;--ok:#22a867}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.wrap{max-width:1200px;margin:0 auto;padding:28px 22px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.title{font-size:28px;font-weight:500;color:var(--muted)}.btn{border:2px solid var(--line);border-radius:8px;background:rgba(246,244,236,.56);color:var(--muted);font:inherit;font-weight:600;padding:9px 14px;cursor:pointer}.btn:hover{background:#e9e5d8;color:var(--accent-dark)}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.status{font-size:13px;color:var(--muted)}
.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"surveys sessions" "ended ended";gap:22px}#surveyPanel{grid-area:surveys}#sessionsPanel{grid-area:sessions}#endedPanel{grid-area:ended}.sessionCode{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent-dark)}.panel{border:2px solid var(--line);border-radius:20px;padding:20px;background:rgba(246,244,236,.18)}.panelHeader{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h2{margin:0;color:var(--muted);font-size:27px;font-weight:500}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:2px solid var(--line);border-radius:11px;padding:12px;background:rgba(247,244,234,.55)}.itemName{font-weight:600;color:var(--text);overflow-wrap:anywhere}.itemMeta{font-size:13px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions .btn{padding:7px 10px;font-size:13px}.actions a.btn{text-decoration:none;display:inline-flex;align-items:center}.empty{border:2px dashed var(--line);border-radius:11px;padding:28px 16px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#efebe0;border:2px solid var(--line);border-radius:10px;padding:12px 15px;max-width:420px;z-index:30}
.hidden{display:none!important}
@media(max-width:800px){.columns{grid-template-columns:1fr;grid-template-areas:"surveys" "sessions" "ended"}.wrap{padding:20px 16px 30px}.top{align-items:flex-start}.item{grid-template-columns:1fr}.actions{justify-content:flex-start}}
body[data-studio="survey"] .studio-title{font-size:clamp(20px,2.5vw,24px)}
body[data-studio="survey"] .icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.55;cursor:wait}
</style>
<link rel="stylesheet" href="../../shared/accessibility.css">
<script src="../../shared/accessibility.js"></script>
<link rel="stylesheet" href="../../shared/shell.css">
<link rel="stylesheet" href="../../shared/dashboard.css?v=compact-2">
<link rel="stylesheet" href="../../shared/workspace.css?v=compact-2">
</head>
<body data-studio="survey" data-dashboard-view="library">
<nav class="app-nav" aria-label="Bereichsnavigation"><a href="../../index.html">← SchulApp</a><span aria-hidden="true">/</span><a href="index.html">Umfrage Studio</a></nav>
<div class="wrap">
<header class="studio-header">
<div class="studio-identity"><span class="studio-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 25V16h4v9M14 25V7h4v18M22 25V12h4v13M4 25h24"/></svg></span><h1 class="studio-title">Umfrage <span>Studio</span></h1></div>
</header>
<main class="columns">
<section class="panel" id="sessionsPanel">
<div class="panelHeader"><h2>Offene Sitzungen</h2></div>
<div class="list" id="activeSessionList"><div class="empty">Sitzungen werden geladen …</div></div>
</section>
<section class="panel" id="endedPanel">
<div class="panelHeader"><h2>Durchgeführte Umfragen</h2></div>
<div class="list" id="endedSessionList"><div class="empty">Abgeschlossene Umfragen werden geladen …</div></div>
</section>
<section class="panel" id="surveyPanel">
<div class="panelHeader"><h2>Deine Umfragen</h2><button class="studio-primary icon-btn" id="newSurveyBtn" type="button" aria-label="Neue Umfrage hinzufügen" title="Neue Umfrage hinzufügen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="list" id="surveyList"></div>
</section>

</main>
</div>
<div class="toast hidden" id="toast"></div>
<script>
const SUPABASE_URL='https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let surveys=[];
let endedSessionRequestToken=0;
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function generateJoinCode(){const alphabet='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';let code='';while(code.length<5){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);for(const byte of bytes){if(byte<252){code+=alphabet[byte%36];if(code.length===5)break}}}return code}
async function createSessionWithUniqueCode(payload){for(let attempt=0;attempt<8;attempt++){const {data,error}=await db.from('sessions').insert({...payload,join_code:generateJoinCode()}).select().single();if(!error)return {data,error:null};if(error.code!=='23505')return {data:null,error}}return {data:null,error:{message:'Es konnte nach mehreren Versuchen kein freier Teilnahmecode erzeugt werden. Bitte erneut versuchen.'}}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function requireUser(){const {data,error}=await db.auth.getUser();if(error||!data.user){window.location.href='../../login.html?next=apps%2Fumfrage%2Findex.html';return null}return data.user}
async function loadSurveys(){const {data,error}=await db.from('surveys').select('id,name,slides,updated_at').order('updated_at',{ascending:false});if(error){toast('Umfragen konnten nicht geladen werden: '+error.message);return}surveys=data||[];renderSurveys()}
async function loadActiveSessions(){
  const root=$('activeSessionList');
  if(!root)return;
  const {data,error}=await db.from('sessions')
    .select('id,title,status,join_code,created_at')
    .in('status',['lobby','running'])
    .order('created_at',{ascending:false});
  if(error){
    root.innerHTML='<div class="empty">Offene Sitzungen konnten nicht geladen werden.</div>';
    toast('Sitzungen konnten nicht geladen werden: '+error.message);
    return;
  }
  const sessions=data||[];
  root.innerHTML='';
  if(!sessions.length){
    root.innerHTML='<div class="empty">Keine offenen Sitzungen. Starte eine Umfrage, um hier eine Sitzung zu sehen.</div>';
    return;
  }
  sessions.forEach(session=>{
    const el=document.createElement('div');
    el.className='item';
    const created=session.created_at?new Date(session.created_at).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):'';
    const state=session.status==='running'?'Läuft gerade':'Bereit zum Start';
    el.innerHTML='<div><div class="itemName">'+esc(session.title||'Umfrage')+'</div>'+
      '<div class="itemMeta">'+esc(created)+' · '+esc(state)+'</div>'+
      '<div class="sessionCode">Teilnahmecode: '+esc(session.join_code||'')+'</div></div>'+
      '<div class="actions"><button class="btn accent openSessionBtn" type="button">Sitzung öffnen</button>'+sessionDeleteButton(session)+'</div>';
    el.querySelector('.openSessionBtn').onclick=()=>{window.location.href='live.html?id='+encodeURIComponent(session.id)};
    el.querySelector('.deleteSessionBtn').onclick=event=>deleteSession(session,event.currentTarget);
    root.appendChild(el);
  });
}

async function loadEndedSessions(){
  const root=$('endedSessionList');
  if(!root)return;
  const requestToken=++endedSessionRequestToken;
  const {data,error}=await db.from('sessions')
    .select('id,title,status,join_code,created_at,started_at,updated_at,survey_snapshot')
    .eq('status','ended')
    .order('updated_at',{ascending:false});
  if(requestToken!==endedSessionRequestToken)return;
  if(error){
    root.innerHTML='<div class="empty">Abgeschlossene Umfragen konnten nicht geladen werden.</div>';
    toast('Abgeschlossene Umfragen konnten nicht geladen werden: '+error.message);
    return;
  }
  const sessions=data||[];
  root.innerHTML='';
  if(!sessions.length){
    root.innerHTML='<div class="empty">Noch keine durchgeführten Umfragen.</div>';
    return;
  }
  sessions.forEach(session=>{
    const el=document.createElement('div');
    el.className='item';
    const slides=Array.isArray(session.survey_snapshot)?session.survey_snapshot:[];
    const started=session.started_at||session.created_at;
    const date=started?new Date(started).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):'';
    el.innerHTML='<div><div class="itemName">'+esc(session.title||'Umfrage')+'</div>'+
      '<div class="itemMeta">'+esc(date)+' · '+slides.length+' Fragen · Abgeschlossen</div></div>'+
      '<div class="actions"><button class="btn accent exportCsvBtn" type="button">CSV herunterladen</button>'+sessionDeleteButton(session)+'</div>';
    const button=el.querySelector('.exportCsvBtn');
    button.onclick=()=>exportSessionCsv(session,button);
    el.querySelector('.deleteSessionBtn').onclick=event=>deleteSession(session,event.currentTarget);
    root.appendChild(el);
  });
}
function sessionDeleteButton(session){
  const label='Sitzung „'+(session.title||'Umfrage')+'“ löschen';
  return '<button class="btn danger icon-btn deleteSessionBtn" type="button" aria-label="'+esc(label)+'" title="'+esc(label)+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button>';
}
let deletingSession=false;
async function deleteSession(session,button){
  if(deletingSession)return;
  if(!confirm('Sitzung „'+(session.title||'Umfrage')+'“ einschließlich aller Teilnehmer und Antworten dauerhaft löschen? Die Umfragevorlage bleibt erhalten.'))return;
  deletingSession=true;button.disabled=true;button.setAttribute('aria-busy','true');
  try{
    const {data,error}=await db.from('sessions').delete().eq('id',session.id).select('id');
    if(error)throw error;
    if(!data?.some(row=>row.id===session.id))throw new Error('Die Sitzung wurde nicht gelöscht. Bitte melde dich erneut an und versuche es noch einmal.');
    await Promise.all([loadActiveSessions(),loadEndedSessions()]);
    toast('Sitzung gelöscht.');
  }catch(error){toast('Löschen fehlgeschlagen: '+(error.message||'Bitte erneut versuchen.'));}
  finally{deletingSession=false;button.disabled=false;button.removeAttribute('aria-busy');}
}
async function fetchAllSessionRows(table,columns,sessionId){
  const rows=[];
  const pageSize=1000;
  for(let offset=0;;offset+=pageSize){
    let query=db.from(table).select(columns).eq('session_id',sessionId);
    if(table==='participants'){
      query=query.order('joined_at',{ascending:true});
    }else{
      query=query.order('slide_index',{ascending:true}).order('created_at',{ascending:true});
    }
    const {data,error}=await query.range(offset,offset+pageSize-1);
    if(error)throw error;
    const batch=data||[];
    rows.push(...batch);
    if(batch.length<pageSize)return rows;
  }
}
function csvCell(value){
  if(value===null||typeof value==='undefined')return '""';
  if(typeof value==='number'&&!Number.isFinite(value))return '""';
  let text=String(value);
  if(typeof value!=='number'&&/^[\s]*[=+\-@]/.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
}
function csvDate(value){
  return value?new Date(value).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'';
}
function makeExportColumns(slides){
  const columns=[];
  slides.forEach((slide,slideIndex)=>{
    const question='Frage '+(slideIndex+1)+': '+(slide.question||'Ohne Fragetext');
    if(slide.type==='Skala'&&Array.isArray(slide.scaleItems)&&slide.scaleItems.length){
      slide.scaleItems.forEach((item,itemIndex)=>{
        columns.push({
          slideIndex:slideIndex,kind:'scale',itemIndex:itemIndex,
          label:question+' – '+(item.statement||('Aussage '+(itemIndex+1)))+
            ' ['+item.min+' bis '+item.max+']'
        });
      });
    }else if(slide.type==='Pin setzen'){
      columns.push({slideIndex:slideIndex,kind:'pin-x',label:question+' – X-Koordinate (%)'});
      columns.push({slideIndex:slideIndex,kind:'pin-y',label:question+' – Y-Koordinate (%)'});
    }else{
      columns.push({slideIndex:slideIndex,kind:'answer',label:question+' ['+(slide.type||'Frage')+']'});
    }
  });
  return columns;
}
function exportedAnswer(response,column){
  if(!response)return '';
  const answer=response.answer||{};
  if(answer.teacherMarked===true)return 'Von Lehrkraft als beantwortet markiert';
  const value=answer.value;
  if(value===null||typeof value==='undefined')return '';
  if(column.kind==='scale'){
    const values=Array.isArray(value.values)?value.values:[];
    const item=values[column.itemIndex];
    return item&&item.value!==null&&typeof item.value!=='undefined'?Number(item.value):'';
  }
  if(column.kind==='pin-x'||column.kind==='pin-y'){
    if(!value||typeof value!=='object')return '';
    const coordinate=column.kind==='pin-x'?value.x:value.y;
    const number=Number(coordinate);
    return Number.isFinite(number)?number.toLocaleString('de-DE',{useGrouping:false,maximumFractionDigits:2}):'';
  }
  if(Array.isArray(value))return value.map((item,index)=>(index+1)+'. '+String(item)).join(' | ');
  if(typeof value==='object')return JSON.stringify(value);
  return value;
}
function downloadSessionCsv(session,headers,rows){
  const csv='\ufeff'+[headers,...rows].map(row=>row.map(csvCell).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  const title=String(session.title||'umfrage').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'umfrage';
  const started=session.started_at||session.created_at;
  const date=started?new Date(started).toISOString().slice(0,10):'ohne-datum';
  link.href=url;
  link.download='schulumfrage-'+title+'-'+date+'-'+String(session.id).slice(0,8)+'.csv';
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function exportSessionCsv(session,button){
  if(!button||button.disabled)return;
  button.disabled=true;
  const originalLabel=button.textContent;
  button.textContent='Export wird erstellt …';
  try{
    const [participants,responses]=await Promise.all([
      fetchAllSessionRows('participants','id,name,joined_at',session.id),
      fetchAllSessionRows('responses','participant_id,slide_index,answer,created_at',session.id)
    ]);
    const slides=Array.isArray(session.survey_snapshot)?session.survey_snapshot:[];
    const columns=makeExportColumns(slides);
    const responseByKey=new Map();
    const responsesByParticipant=new Map();
    responses.forEach(response=>{
      responseByKey.set(response.participant_id+':'+response.slide_index,response);
      if(!responsesByParticipant.has(response.participant_id))responsesByParticipant.set(response.participant_id,[]);
      responsesByParticipant.get(response.participant_id).push(response);
    });
    const headers=['Teilnehmer','Beigetreten am','Gespeicherte Antworten'].concat(columns.map(column=>column.label));
    const rows=participants.map(participant=>{
      const ownResponses=responsesByParticipant.get(participant.id)||[];
      const values=columns.map(column=>exportedAnswer(
        responseByKey.get(participant.id+':'+column.slideIndex),column
      ));
      return [participant.name||'Schüler',csvDate(participant.joined_at),ownResponses.length,...values];
    });
    downloadSessionCsv(session,headers,rows);
    toast('CSV exportiert: '+participants.length+' Teilnehmer, '+responses.length+' gespeicherte Antworten.');
  }catch(error){
    toast('Export fehlgeschlagen: '+(error.message||'Daten konnten nicht geladen werden.'));
  }finally{
    button.disabled=false;
    button.textContent=originalLabel;
  }
}

function renderSurveys(){const root=$('surveyList');root.innerHTML='';if(!surveys.length){root.innerHTML='<div class="empty">Noch keine Umfragen vorhanden.</div>';return}surveys.forEach(s=>{const el=document.createElement('div');el.className='item';el.innerHTML='<div><div class="itemName">'+esc(s.name)+'</div><div class="itemMeta">'+((s.slides||[]).length)+' Folien</div></div><div class="actions"><button class="btn start">Starten</button><button class="btn edit">Bearbeiten</button><button class="btn danger icon-btn del" type="button" aria-label="Umfrage löschen" title="Umfrage löschen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button></div>';el.querySelector('.start').onclick=()=>startSurvey(s);el.querySelector('.edit').onclick=()=>window.location.href='editor.html?id='+encodeURIComponent(s.id);el.querySelector('.del').onclick=()=>deleteSurvey(s);root.appendChild(el)})}
async function startSurvey(s){const user=await requireUser();if(!user)return;const {data,error}=await createSessionWithUniqueCode({survey_id:s.id,owner_id:user.id,title:s.name,survey_snapshot:s.slides,status:'lobby',current_slide:0});if(error){toast('Session konnte nicht gestartet werden: '+error.message);return}window.location.href='live.html?id='+encodeURIComponent(data.id)}
async function deleteSurvey(s){if(!confirm('Umfrage wirklich löschen?'))return;const {error}=await db.from('surveys').delete().eq('id',s.id);if(error){toast('Löschen fehlgeschlagen: '+error.message);return}surveys=surveys.filter(x=>x.id!==s.id);renderSurveys();toast('Umfrage gelöscht.')}
$('newSurveyBtn').onclick=()=>window.location.href='editor.html?new=1';
(async()=>{const user=await requireUser();if(user){await Promise.all([loadSurveys(),loadActiveSessions(),loadEndedSessions()]);setInterval(()=>{if(!document.hidden){loadActiveSessions();loadEndedSessions()}},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadActiveSessions();loadEndedSessions()}})}})();
</script>
</body>
</html>
