name: Unterrichtsabläufe prüfen
on:
  pull_request:
  push:
    branches: [main, fix/reliability-and-usability]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Komponenten prüfen
        run: |
          node tests/security.test.cjs
          node tests/rich-text.test.cjs
          node tests/library.test.cjs
          node tests/status.test.cjs
          node tests/live-data.test.cjs
          node tests/pin-input.test.cjs
          node tests/structure.test.cjs
          node tests/pin.test.cjs
      - name: Gemischte Quiz-Regeln in PostgreSQL prüfen
        run: |
          psql -f tests/quiz-modes-db.sql
          node tests/quiz-modes-concurrency.cjs
          psql -v ON_ERROR_STOP=1 -f supabase/quiz_pin.sql
          psql -v ON_ERROR_STOP=1 -f tests/pin-db.sql
      - name: Testbrowser vorbereiten
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1 jsqr@1.4.0
          npx playwright install --with-deps chromium
      - name: Unterrichtsabläufe im Browser prüfen
        run: |
          node tests/browser.test.cjs
          node tests/quiz-modes.browser.cjs
          node tests/pin.browser.cjs
      - name: Testansichten aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetische-testansichten
          path: |
            test-results/pin-*.png
            test-results/pin-desktop.png
            test-results/join-mobile.png
            test-results/hub-desktop.png
            test-results/hub-mobile.png
            test-results/studio-*.png
            test-results/editor-*.png
            test-results/live-*.png
            test-results/modes-*.png
          if-no-files-found: ignore







