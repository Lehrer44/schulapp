name: Unterrichtsabläufe prüfen
on:
  pull_request:
  push:
    branches: [main, fix/reliability-and-usability]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Komponenten prüfen
        run: |
          node tests/security.test.cjs
          node tests/library.test.cjs
          node tests/status.test.cjs
          node tests/live-data.test.cjs
          node tests/pin-input.test.cjs
      - name: Testbrowser vorbereiten
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Unterrichtsabläufe im Browser prüfen
        run: node tests/browser.test.cjs
      - name: Testansichten aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetische-testansichten
          path: |
            ../pin-desktop.png
            ../join-mobile.png
          if-no-files-found: ignore
