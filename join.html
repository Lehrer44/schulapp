<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SchulApp – Teilnehmen</title>
<link rel="stylesheet" href="shared/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f1efe6;--line:#93856a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#473f32;font:17px/1.5 system-ui,sans-serif}main{max-width:520px;margin:var(--space-4) auto;padding:var(--dialog-padding);border:2px solid var(--line);border-radius:18px;width:calc(100% - 2 * var(--page-gutter));}h1{font-size:var(--title-size);line-height:1.2;margin:0 0 var(--space-3);}label{display:block;font-weight:650}input,button{font:inherit;border:2px solid var(--line);border-radius:8px;padding:12px;width:100%;margin:8px 0;min-height:var(--control-size);}input{text-transform:uppercase;letter-spacing:.12em}button{background:#635846;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#245b92}.error{color:#792d20}.choices{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:600px){main{margin:var(--space-4) auto;padding:var(--dialog-padding);width:calc(100% - 2 * var(--page-gutter));}}[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="shared/app-status.css"><link rel="stylesheet" href="shared/accessibility.css">
<script src="shared/connection-status.js"></script>
</head>
<body><main>
<h1>Am Unterricht teilnehmen</h1><p>Ein Einstieg für Umfragen, Quizze und das Ja/Nein-Schätzspiel. Gib den Code von deiner Lehrkraft ein.</p>
<form id="entryForm"><label for="entryCode">Teilnahmecode</label><input id="entryCode" maxlength="5" minlength="5" pattern="[A-Za-z0-9]{5}" autocapitalize="characters" autocomplete="off" required placeholder="z. B. A7K3P"><button id="continueBtn" type="submit">Weiter</button></form>
<p id="entryError" class="error" role="alert"></p><div class="choices" id="kindChoices" hidden><button type="button" data-kind="survey">Zur Umfrage</button><button type="button" data-kind="quiz">Zum Quiz</button><button type="button" data-kind="bluff">Zum Bluff-Quiz</button><button type="button" data-kind="yesno">Zum Ja/Nein-Schätzspiel</button></div>
<p><a href="index.html">Zur Startseite</a></p>
</main><script>
const client=supabase.createClient('https://mqtcwiiawmuxrpkjfrfc.supabase.co','sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-');
const params=new URLSearchParams(location.search),codeInput=document.getElementById('entryCode');
const normalize=value=>value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
codeInput.value=normalize(params.get('code')||'');
codeInput.addEventListener('input',()=>codeInput.value=normalize(codeInput.value));
function route(kind){const url=new URL(kind==='yesno'?'apps/quiz-studio/yesno/student.html':kind==='bluff'?'apps/quiz-studio/bluff/student.html':kind==='quiz'?'apps/quiz-studio/student.html':'apps/umfrage/student.html',location.href);url.searchParams.set('code',codeInput.value);location.replace(url.href);}
async function resolveCode(){
 const button=document.getElementById('continueBtn'),error=document.getElementById('entryError');button.disabled=true;error.textContent='';document.getElementById('kindChoices').hidden=true;setConnectionStatus('waiting','Code wird geprüft …');
 try{const hint=params.get('kind');const {data,error:failure}=await client.rpc('classroom_resolve_code',{p_join_code:codeInput.value,p_kind_hint:['quiz','survey','bluff','yesno'].includes(hint)?hint:null});if(failure)throw failure;if(!data?.ok)throw new Error(data?.error||'SESSION_NOT_FOUND');if(data.kinds.length===1)route(data.kinds[0]);else{document.getElementById('kindChoices').hidden=false;document.querySelectorAll('[data-kind]').forEach(b=>b.hidden=!data.kinds.includes(b.dataset.kind));error.textContent='Dieser Code wird für mehrere Aktivitäten verwendet. Wähle die Aktivität deiner Lehrkraft.';setConnectionStatus('ready','Code bestätigt. Bitte Aktivität auswählen.');}}
 catch(failure){error.textContent=failure.message==='JOIN_RATE_LIMITED'?'Zu viele Versuche. Bitte warte eine Minute.':failure.message==='SESSION_NOT_FOUND'?'Keine offene Aktivität gefunden. Prüfe den Code oder frage deine Lehrkraft.':'Der Code konnte nicht geprüft werden. Bitte erneut versuchen.';setConnectionStatus('error',error.textContent);}
 finally{button.disabled=false;}
}
document.getElementById('entryForm').onsubmit=event=>{event.preventDefault();resolveCode()};
document.querySelectorAll('[data-kind]').forEach(button=>button.onclick=()=>route(button.dataset.kind));
if(codeInput.value.length===5)resolveCode();else codeInput.focus();
</script></body></html>
