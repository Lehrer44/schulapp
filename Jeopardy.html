<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeopardy Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;--bg:#f3f1e9;--surface:#fffefa;--surface-soft:#faf8f1;--surface-muted:#eeeadd;--line:#d9d2c2;--line-strong:#b9ad93;--text:#34352e;--muted:#777668;--accent:#88784f;--accent-dark:#665a3d;--accent-soft:#eee7d5;--board:#f8f4e9;--board-hover:#eee5d1;--danger:#b9504e;--danger-soft:#f8e8e5;--ok:#36795d;--ok-soft:#e5f1e8;--shadow:0 14px 36px rgba(69,59,37,.07);--shadow-soft:0 5px 16px rgba(69,59,37,.06)}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 8% 0%,rgba(255,255,255,.88),transparent 38rem),linear-gradient(145deg,#f5f3ed 0%,var(--bg) 58%,#ebe7dc 100%);color:var(--text);min-height:100vh;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid transparent;border-radius:11px;padding:.72rem 1rem;background:var(--accent-dark);color:#fffdf7;font-weight:700;box-shadow:0 2px 4px rgba(49,42,29,.05);transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease}
button:hover:not(:disabled){background:#554a32;box-shadow:0 5px 12px rgba(49,42,29,.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{cursor:not-allowed;opacity:.5;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex="0"]:focus-visible{outline:3px solid #b6a26a;outline-offset:3px}
.secondary{background:var(--surface);border-color:var(--line);color:var(--text);box-shadow:none}
.secondary:hover:not(:disabled){background:var(--surface-muted);border-color:var(--line-strong);color:var(--text)}
.danger{background:var(--danger);color:white}.danger:hover:not(:disabled){background:#9f3e3d}
.gold{background:var(--accent);border-color:var(--accent);color:#fffdf7}.gold:hover:not(:disabled){background:var(--accent-dark);border-color:var(--accent-dark)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
#app{min-height:100vh;max-width:1500px;margin:0 auto;padding:clamp(16px,3vw,38px)}
.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px;padding:20px 22px;background:rgba(255,254,250,.82);border:1px solid rgba(217,210,194,.95);border-radius:22px;box-shadow:var(--shadow-soft);backdrop-filter:blur(12px)}
.brand-lockup{display:flex;align-items:center;gap:13px;min-width:0}
.brand-symbol{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;background:var(--accent-dark);color:#fffdf7;font-size:1.45rem;font-weight:900;letter-spacing:-.06em;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.brand{font-size:1.16rem;font-weight:850;letter-spacing:-.035em;line-height:1.2;overflow-wrap:anywhere}
.brand span{color:var(--accent);font-weight:700}
.brand-sub{font-size:.82rem;color:var(--muted);margin-top:4px}
.panel{background:rgba(255,254,250,.91);border:1px solid var(--line);border-radius:21px;padding:clamp(16px,2.2vw,26px);margin-bottom:18px;box-shadow:var(--shadow)}
.panel h2{font-size:1.32rem;letter-spacing:-.025em;margin:0 0 8px;font-weight:800}
.library-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.eyebrow{font-size:.72rem;letter-spacing:.14em;font-weight:850;color:var(--accent);margin:0 0 7px}
.panel-lead{margin:0;color:var(--muted);max-width:58ch;font-size:.94rem;line-height:1.55}
.library-count{flex:0 0 auto;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface-soft);color:var(--muted);font-size:.8rem;font-weight:750}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font-size:.87rem;color:var(--muted);font-weight:750}
.field input,.field select,.field textarea,.team-name-input{width:100%;min-width:0;background:#fffefa;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:.76rem .85rem;box-shadow:inset 0 1px 2px rgba(49,42,29,.025)}
.field input:hover,.field select:hover,.field textarea:hover,.team-name-input:hover{border-color:var(--line-strong)}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.hidden{display:none!important}
.games{display:flex;flex-direction:column;gap:10px}
.game-card{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;background:linear-gradient(160deg,#fffefa,var(--surface-soft));border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:var(--shadow-soft);transition:border-color .18s ease,box-shadow .18s ease}
.game-card:hover{border-color:var(--line-strong);box-shadow:0 8px 20px rgba(69,59,37,.07)}
.game-card h3{margin:0 0 4px;font-size:1.03rem;letter-spacing:-.02em;overflow-wrap:anywhere}.game-card .row{margin-top:0;justify-content:flex-end}
.game-card .game-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.game-card .order-actions{display:flex;gap:5px;margin-right:3px}
.game-card .order-button{padding:.55rem .7rem;min-width:38px;background:var(--surface);border:1px solid var(--line);color:var(--text);box-shadow:none;font-size:.95rem}
.game-card .order-button:hover:not(:disabled){background:var(--surface-muted);border-color:var(--line-strong)}
@media(max-width:760px){.game-card{grid-template-columns:1fr;align-items:stretch}.game-card .game-actions{justify-content:flex-start}.game-card .order-actions{margin-right:2px}}
@media(max-width:440px){.game-card .game-actions button{flex:1}.game-card .order-actions button{flex:0 0 auto}}
.muted{color:var(--muted);font-size:.9rem;line-height:1.5}
.empty{color:var(--muted);padding:24px 18px;text-align:center;border:1px dashed var(--line-strong);border-radius:14px;background:rgba(250,248,241,.6)}
.storage-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid #ded3b8;border-radius:15px;padding:15px 17px;color:var(--accent-dark);font-size:.9rem;line-height:1.55}
.storage-note code{background:rgba(255,255,255,.6);border:1px solid rgba(136,120,79,.18);border-radius:6px;padding:2px 5px;font-size:.84em}
.board-wrap{overflow:auto;scrollbar-color:var(--line-strong) transparent}
.board{display:grid;gap:10px;min-width:650px}
.cell{min-height:clamp(82px,10vh,128px);background:var(--board);border:1px solid var(--line);border-radius:15px;color:var(--accent-dark);font-size:clamp(1.25rem,2.3vw,1.9rem);font-weight:850;letter-spacing:-.035em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;gap:7px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 5px rgba(69,59,37,.035);text-decoration:none}
.cell:hover:not(:disabled){background:var(--board-hover);border-color:var(--line-strong);color:#4f452e;box-shadow:0 7px 16px rgba(69,59,37,.09);transform:translateY(-1px)}
.cell.header{background:var(--accent-dark);border-color:var(--accent-dark);color:#fffdf7;font-size:clamp(.82rem,1.5vw,1rem);letter-spacing:.015em;line-height:1.3;min-height:68px;padding:10px}
.cell.header:hover{background:var(--accent-dark);transform:none;box-shadow:none}
.cell.used{background:#e9e7e0;border-color:#e0ddd3;color:#a5a194;text-decoration:line-through}.cell.used:hover{background:#e9e7e0;transform:none;box-shadow:none}
.cell.reduced{background:#f3e7bf;color:#786126;border-color:#d7c087}
.cell.reduced::after{content:'½';position:absolute;top:7px;right:7px;background:#dfc778;color:#4d3d16;font-size:.7rem;padding:3px 7px;border-radius:999px;font-weight:900}
.cell.editable{outline:2px dashed #b39e65;outline-offset:-5px}
.cell-points{line-height:1}
.cell-status{font-size:.66rem;font-weight:800;line-height:1.1;padding:4px 7px;border-radius:999px;text-decoration:none}
.cell-status.has-question{background:var(--ok-soft);color:#286347;border:1px solid #bad8c3}
.cell-status.no-question{background:var(--danger-soft);color:#9c3e3d;border:1px solid #e7c1bc}
.team-award{background:var(--ok);border:1px solid var(--ok);color:#fff}.team-award:hover:not(:disabled){background:#286447}
.team-deduct{background:var(--danger);border:1px solid var(--danger);color:#fff}.team-deduct:hover:not(:disabled){background:#983d3b}
.action-block{padding:15px;background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;margin-top:14px}
.action-block h4{margin:0 0 9px;font-size:.98rem;letter-spacing:-.01em}
.action-help{color:var(--muted);font-size:.88rem;margin-bottom:8px;line-height:1.5}
.scorebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.team{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;transition:box-shadow .2s,border-color .2s;box-shadow:var(--shadow-soft)}
.team.flash{box-shadow:0 0 0 3px rgba(136,120,79,.25),var(--shadow-soft);border-color:var(--accent)}
.team input{width:100%;background:transparent;color:var(--text);border:0;font-weight:800;font-size:.98rem;outline:none;padding:0}
.team input:focus{outline:2px solid #b6a26a;outline-offset:4px;border-radius:4px}
.score{font-size:2rem;line-height:1.25;font-weight:900;color:var(--accent-dark);cursor:pointer;padding:5px 0;position:relative;display:inline-block;min-width:60px;font-variant-numeric:tabular-nums}
.score-delta{position:absolute;right:0;top:-4px;font-size:.95rem;font-weight:900;color:var(--ok);animation:floatUp 1.25s ease-out forwards;pointer-events:none}.score-delta.neg{color:var(--danger)}
@keyframes floatUp{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-32px)}}
.modal{position:fixed;inset:0;background:rgba(48,44,34,.45);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;animation:fadeIn .16s ease-out}
.modalbox{width:min(960px,100%);max-height:min(94vh,1000px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,3.2vw,34px);box-shadow:0 28px 80px rgba(33,29,20,.22);color:var(--text);animation:riseIn .2s ease-out}
.modalbox h2{font-size:1.1rem;letter-spacing:-.015em;margin:0 0 14px;color:var(--muted);font-weight:750}.modalbox p{color:var(--muted)}
.media-preview{max-width:100%;max-height:320px;display:block;margin:16px auto 0;border-radius:13px;object-fit:contain}
.hint{color:var(--muted);font-size:.88rem;line-height:1.5}
.hint.reduced-note{color:#786126;background:#f7efcf;border:1px solid #eadba8;padding:10px 12px;border-radius:10px}
.hint.warning-note{color:#963e3d;background:var(--danger-soft);border:1px solid #e7c1bc;padding:10px 12px;border-radius:10px}
.question-box{font-size:clamp(1.65rem,3.2vw,2.55rem);font-weight:800;line-height:1.3;letter-spacing:-.035em;padding:clamp(28px,5vw,56px) clamp(22px,4vw,44px);background:linear-gradient(145deg,#fffefa,var(--surface-soft));border:1px solid var(--line-strong);border-radius:22px;margin-top:12px;min-height:clamp(190px,29vh,360px);display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 22px rgba(69,59,37,.055)}
.answer-reveal{padding:clamp(26px,4vw,44px);background:linear-gradient(145deg,var(--ok-soft),#f5fbf6);border:1px solid #bfdbc7;border-radius:22px;min-height:clamp(190px,29vh,360px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.answer-label{color:#286347;font-size:.78rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.answer-text{font-size:clamp(1.6rem,3vw,2.35rem);font-weight:800;line-height:1.35;letter-spacing:-.025em;overflow-wrap:anywhere}
.no-answer-trigger{width:100%;min-height:66px;margin-top:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-soft);border:1px solid var(--line-strong);border-radius:15px;color:var(--text);font-size:1.15rem;font-weight:800;box-shadow:none}
.no-answer-trigger:hover:not(:disabled){background:var(--surface-muted);border-color:var(--accent);transform:translateY(-1px)}
.answer-reveal-trigger{width:100%;min-height:66px;margin-top:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#8d7a4c,#6c5c3a);border:1px solid #6c5c3a;border-radius:15px;color:#fffdf7;box-shadow:0 8px 18px rgba(102,90,61,.16);font-size:1.12rem;font-weight:800;letter-spacing:-.015em}
.answer-reveal-trigger:hover:not(:disabled){background:linear-gradient(135deg,#76643f,#55492f);box-shadow:0 10px 22px rgba(102,90,61,.2);transform:translateY(-1px)}
.outcome-actions{margin-top:14px}
.wrong-answer{padding:14px;background:var(--danger-soft);border:1px solid #e7c1bc;border-radius:12px;color:#8e3837;line-height:1.5}
.team-name-input{flex:1;background:#fffefa;color:var(--text)}
.toast{position:fixed;right:20px;bottom:20px;background:#34352e;color:#fffdf7;border:1px solid rgba(255,255,255,.15);padding:13px 17px;border-radius:13px;display:none;z-index:20;max-width:min(420px,calc(100vw - 32px));box-shadow:0 12px 32px rgba(0,0,0,.18);font-size:.92rem}
.loading{position:fixed;inset:0;background:rgba(243,241,233,.88);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:30;color:var(--text);font-weight:750;gap:12px}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes riseIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:760px){#app{padding:12px}.top{align-items:flex-start;flex-direction:column;padding:17px;border-radius:17px}.top>.row{width:100%}.top>.row button{flex:1}.panel{border-radius:17px;padding:16px}.library-heading{flex-direction:column}.library-count{align-self:flex-start}.cell{min-height:76px;font-size:1.13rem;border-radius:11px;padding:8px}.cell.header{font-size:.82rem;min-height:62px}.scorebar{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}.team{padding:11px 12px}.score{font-size:1.7rem}.modal{padding:10px}.modalbox{border-radius:17px}}
@media(max-width:440px){.brand-symbol{width:42px;height:42px;flex-basis:42px;border-radius:13px}.brand{font-size:1.03rem}.brand-sub{font-size:.78rem}.games{grid-template-columns:1fr}.game-card .row button{flex:1}.scorebar{grid-template-columns:1fr 1fr}.team input{font-size:.88rem}.score{font-size:1.45rem;min-width:0}.board{min-width:610px;gap:7px}.cell{min-height:70px;font-size:1rem}.cell.header{min-height:58px;font-size:.75rem}.toast{right:12px;bottom:12px}}
.score.positive{color:#287650}.score.negative{color:#b44240}.score.zero{color:var(--accent-dark)}
.cell.used{color:#777467;text-decoration:none;background:#e9e7e0;border-color:#d7d3c8}
.cell.used:hover{color:#777467;background:#e9e7e0;transform:none;box-shadow:none}
.played-team{font-size:clamp(.78rem,1.1vw,.98rem);font-weight:850;line-height:1.2;white-space:normal;overflow-wrap:anywhere;text-decoration:none}
.played-points{font-size:clamp(.78rem,1.05vw,.94rem);font-weight:900;line-height:1.1;color:#686456;text-decoration:none}
.award-confirmation{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-top:0;border:1px solid #bfdbc7;border-radius:13px;background:var(--ok-soft);color:#286347;font-weight:750}
.award-confirmation strong{font-weight:900}
.outcome-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.outcome-grid .action-block{margin-top:0;min-width:0}
.action-team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.action-team-grid button{min-width:0;padding:.68rem .55rem;overflow-wrap:anywhere}
.answer-reveal-trigger{width:100%;min-height:112px;margin-top:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(135deg,#8d7a4c,#6c5c3a);border:1px solid #6c5c3a;border-radius:18px;color:#fffdf7;box-shadow:0 10px 24px rgba(102,90,61,.2);font-size:clamp(1.25rem,2.2vw,1.65rem);letter-spacing:-.025em}
.answer-reveal-trigger:hover:not(:disabled){background:linear-gradient(135deg,#76643f,#55492f);box-shadow:0 13px 28px rgba(102,90,61,.25);transform:translateY(-2px)}
.answer-trigger-icon{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:rgba(255,255,255,.17);font-size:1.1rem}
.answer-trigger-hint{font-size:.78rem;font-weight:600;letter-spacing:.02em;opacity:.8}
.editor-board-wrap{overflow:visible}
.editor-board .cell.header{padding:5px}
.header-editable{min-width:0}
.grid-header-input{width:100%;min-width:0;padding:8px 3px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.4);border-radius:0;color:#fffdf7;text-align:center;font-weight:800;font-size:clamp(.8rem,1.2vw,1rem);line-height:1.25;outline:none}
.grid-header-input:focus{border-bottom-color:#fffdf7;outline:2px solid rgba(255,255,255,.5);outline-offset:1px}
.row-point-label{font-size:.78rem!important;letter-spacing:.02em;line-height:1.2}
.row-point-editor{min-width:0;background:#eee7d5;border-color:#d3c5a6;color:var(--accent-dark);gap:8px;padding:8px}
.row-point-label-small{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;color:var(--muted)}
.grid-points-input{width:100%;min-width:0;border:1px solid #c8baa0;border-radius:10px;background:#fffefa;color:var(--accent-dark);font-size:clamp(1.05rem,1.65vw,1.45rem);font-weight:900;text-align:center;padding:8px 2px;font-variant-numeric:tabular-nums}
.grid-points-input:focus{outline:3px solid #b6a26a;outline-offset:1px}
.editor-board .cell{min-width:0;min-height:110px;font-size:1rem;white-space:normal}
.editor-board .cell.editable{cursor:pointer}
.editor-board .cell-status{font-size:.74rem;line-height:1.25;white-space:normal}
.play-screen{height:100dvh;overflow:hidden}
.play-screen #app{width:100%;max-width:none;height:100dvh;min-height:0;display:flex;flex-direction:column;gap:clamp(8px,1.15vh,14px);padding:clamp(8px,1.15vh,16px) clamp(10px,1.1vw,18px);overflow:hidden}
.play-screen .top{flex:0 0 auto;margin:0;padding:clamp(9px,1vh,14px) clamp(12px,1.4vw,22px);border-radius:16px;gap:12px}
.play-screen .brand-symbol{width:40px;height:40px;flex-basis:40px;border-radius:12px}
.play-screen .brand{font-size:1.05rem}
.play-screen .brand-sub{font-size:.76rem;margin-top:2px}
.play-screen .top>.row{justify-content:flex-end;gap:7px}
.play-screen .top>.row button{padding:.58rem .82rem;font-size:.88rem}
.play-screen .scorebar{flex:0 0 auto;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin:0}
.play-screen .team{padding:clamp(7px,.75vh,11px) 12px;border-radius:13px}
.play-screen .team input{font-size:.9rem}
.play-screen .score{font-size:clamp(1.35rem,2.2vw,2rem);padding:2px 0}
.play-screen .panel.board-wrap{flex:1 1 auto;min-height:0;margin:0;padding:clamp(6px,.75vw,12px);overflow:hidden;display:flex;border-radius:16px}
.play-screen .board{flex:1 1 auto;width:100%;height:100%;min-width:0;gap:clamp(4px,.55vw,9px)}
.play-screen .cell{min-width:0;min-height:0;padding:clamp(4px,.65vw,10px);gap:5px;border-radius:clamp(8px,1vw,15px);font-size:clamp(1.45rem,2.7vw,2.65rem);line-height:1.08}
.play-screen .cell.header{min-height:0;font-size:clamp(.95rem,1.55vw,1.35rem);line-height:1.18;padding:8px 5px;overflow-wrap:anywhere}
.play-screen .cell.reduced::after{top:4px;right:4px}
.play-screen .scorebar:empty{display:none}
.play-screen #app>.top .brand-lockup{gap:10px}
.play-screen .modalbox{width:min(1040px,100%)}
.play-screen .question-box{font-size:clamp(1.75rem,3.3vw,2.65rem)}
@media(max-width:760px){
 .outcome-grid{grid-template-columns:1fr}
 .outcome-grid .action-block{padding:12px}
 .answer-reveal-trigger{min-height:90px}
 .editor-board .cell{min-height:90px}
 .row-point-label{font-size:.68rem!important}
 .grid-points-input{font-size:1rem;padding:6px 1px}

<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="loading" class="loading hidden" role="status" aria-live="polite"><span class="spinner"></span><span id="loadingText">Lade …</span></div>
<script>
'use strict';

const SUPABASE_URL = 'https://mqtcwiiawmuxrpkjfrfc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eY5NBW8EJHuyO2Ic5S3HBQ_tSwErhp-';
const gameCloud = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const GAME_STORAGE_BUCKET = 'jeopardy-games';

let cloudLibraryLoaded = false;

/* ============ State ============ */

let current = null;
let editMode = false;
let teams = [];
let gamesFileHandle = null;

let dirty = false;
let undoStack = [];
let currentView = 'home';
let lastFocusedBeforeModal = null;

const FILE_VERSION = 2;
const MAX_MEDIA_SIZE = 5 * 1024 * 1024;

/* ============ Utils ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function esc(s){ return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function numOr(v, fb){ const n = Number(v); return Number.isFinite(n) ? n : fb; }

let toastTimer = null;
function toast(t){
  const x = document.getElementById('toast');
  x.textContent = t;
  x.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => x.style.display = 'none', 2000);
}
function setLoading(on, text){
  const el = document.getElementById('loading');
  if(on){
    document.getElementById('loadingText').textContent = text || 'Lade …';
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

/* ============ Modal & Dialog System ============ */
function trapFocus(e){
  if(e.key !== 'Tab') return;
  const box = e.currentTarget.querySelector('.modalbox');
  const focusables = box.querySelectorAll('button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])');
  if(!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

function openModalWithFocus(html, opts){
  opts = opts || {};
  lastFocusedBeforeModal = document.activeElement;
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="modalbox">' + html + '</div></div>';
  const modal = root.querySelector('.modal');
  const box = root.querySelector('.modalbox');
  modal.addEventListener('keydown', trapFocus);
  modal.addEventListener('keydown', e => {
    if(e.key === 'Escape' && !opts.noEscape){
      e.preventDefault();
      if(opts.onEscape) opts.onEscape();
      else closeModal();
    }
  });
  let target = opts.focus ? box.querySelector(opts.focus) : box.querySelector('button:not([disabled]), input, textarea, select, [tabindex="0"]');
  if(target) try { target.focus(); } catch(e){}
  return box;
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  const el = lastFocusedBeforeModal;
  lastFocusedBeforeModal = null;
  if(el && document.contains(el) && typeof el.focus === 'function'){
    try { el.focus(); } catch(e){}
  }
}

function customConfirm(message, opts){
  opts = opts || {};
  return new Promise(resolve => {
    let resolved = false;
    function finish(val){
      if(resolved) return;
      resolved = true;
      closeModal();
      resolve(val);
    }
    openModalWithFocus(
      '<h2>' + esc(opts.title || 'Bestätigung') + '</h2>' +
      '<p style="line-height:1.5;white-space:pre-wrap">' + esc(message) + '</p>' +
      '<div class="row" style="margin-top:16px">' +
        '<button class="' + (opts.danger ? 'danger' : '') + '" id="dlgOk">' + esc(opts.okLabel || 'OK') + '</button>' +
        '<button class="secondary" id="dlgCancel">' + esc(opts.cancelLabel || 'Abbrechen') + '</button>' +
      '</div>',
      { focus: '#dlgOk', onEscape: () => finish(false) }
    );
    document.getElementById('dlgOk').addEventListener('click', () => finish(true));
    document.getElementById('dlgCancel').addEventListener('click', () => finish(false));
  });
}

function customPrompt(message, defaultValue, opts){
  opts = opts || {};
  return new Promise(resolve => {
    let resolved = false;
    function finish(val){
      if(resolved) return;
      resolved = true;
      closeModal();
      resolve(val);
    }
    const minAttr = opts.min !== undefined ? ' min="' + esc(opts.min) + '"' : '';
    const maxAttr = opts.max !== undefined ? ' max="' + esc(opts.max) + '"' : '';
    const stepAttr = opts.step !== undefined ? ' step="' + esc(opts.step) + '"' : '';
    openModalWithFocus(
      '<h2>' + esc(opts.title || 'Eingabe') + '</h2>' +
      '<div class="field">' +
        '<label for="dlgInput">' + esc(message) + '</label>' +
        '<input id="dlgInput" type="' + esc(opts.type || 'text') + '" value="' + esc(defaultValue ?? '') + '"' + minAttr + maxAttr + stepAttr + '>' +
      '</div>' +
      '<div class="row" style="margin-top:16px">' +
        '<button id="dlgOk">' + esc(opts.okLabel || 'OK') + '</button>' +
        '<button class="secondary" id="dlgCancel">Abbrechen</button>' +
      '</div>',
      { focus: '#dlgInput', onEscape: () => finish(null) }
    );
    const input = document.getElementById('dlgInput');
    input.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); finish(input.value); }
    });
    document.getElementById('dlgOk').addEventListener('click', () => finish(input.value));
    document.getElementById('dlgCancel').addEventListener('click', () => finish(null));
  });
}

function customAlert(message, opts){
  opts = opts || {};
  return new Promise(resolve => {
    openModalWithFocus(
      '<h2>' + esc(opts.title || 'Hinweis') + '</h2>' +
      '<p style="line-height:1.5;white-space:pre-wrap">' + esc(message) + '</p>' +
      '<div class="row" style="margin-top:16px"><button id="dlgOk">OK</button></div>',
      { focus: '#dlgOk', onEscape: () => { closeModal(); resolve(); } }
    );
    document.getElementById('dlgOk').addEventListener('click', () => { closeModal(); resolve(); });
  });
}

/* ============ Game Model ============ */
function normalizeGame(g){
  g = g || {};
  g.id = g.id || uid();
  g.name = g.name || 'Unbenannt';
  g.rows = Math.max(1, Math.min(20, Number(g.rows) || 1));
  g.cols = Math.max(1, Math.min(20, Number(g.cols) || 1));
  g.colHeaders = Array.from({length: g.cols}, (_, i) => (g.colHeaders && g.colHeaders[i]) || 'Spalte ' + (i + 1));
  g.rowHeaders = Array.from({length: g.rows}, (_, i) => {
    const v = Number(g.rowHeaders ? g.rowHeaders[i] : NaN);
    return String(Number.isFinite(v) ? v : (i + 1) * 100);
  });
  g.points = Array.from({length: g.rows}, (_, i) =>
    Array.from({length: g.cols}, (_, j) => {
      const v = g.points && g.points[i] ? Number(g.points[i][j]) : NaN;
      return Number.isFinite(v) ? v : Number(g.rowHeaders[i]);
    })
  );
  g.cells = g.cells || {};
  for(let i = 0; i < g.rows; i++){
    for(let j = 0; j < g.cols; j++){
      const k = i + ',' + j;
      const c = g.cells[k] || {};
      g.cells[k] = {
        text: String(c.text || ''),
        answer: String(c.answer || ''),
        type: c.type || 'text',
        data: c.data || '',
        name: c.name || '',
        used: false,
        reduced: false
      };
    }
  }
  return g;
}

function packGames(){
  return {
    format: 'Offline Jeopardy Spiele',
    version: FILE_VERSION,
    updatedAt: new Date().toISOString(),
    games: games.map(normalizeGame)
  };
}

/* ============ IndexedDB ============ */
function idbOpen(){
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('offline-jeopardy-settings', 1);
    r.onupgradeneeded = () => {
      if(!r.result.objectStoreNames.contains('settings')) r.result.createObjectStore('settings');
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(key, value){
  try{
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction('settings', 'readwrite');
      tx.objectStore('settings').put(value, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
    db.close();
  }catch(e){}
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    const val = await new Promise((res, rej) => {
      const r = db.transaction('settings').objectStore('settings').get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    db.close();
    return val;
  }catch(e){ return null; }
}

/* ============ File I/O ============ */
async function restoreLastFile(){
  if(!('showOpenFilePicker' in window)) return;
  const handle = await idbGet('gamesFileHandle');
  if(!handle) return;
  try{
    const permission = await handle.queryPermission({mode: 'readwrite'});
    gamesFileHandle = handle;
    const file = await handle.getFile();
    gamesFileName = file.name;
    lastFileAvailable = true;
    if(permission === 'granted'){
      setLoading(true, 'Lade letzte Datei …');
      const data = JSON.parse(await file.text());
      if(!Array.isArray(data.games)) throw new Error('Keine gültige Jeopardy-Spieldatei.');
      games = data.games.map(normalizeGame);
      toast(games.length + ' Spiele automatisch geladen');
    }
  }catch(e){
    gamesFileHandle = null;
    gamesFileName = '';
    lastFileAvailable = false;
  }finally{
    setLoading(false);
    renderHome();
  }
}

      .from('jeopardy_catalog')
      .select('payload')

    games = [];
    gamesFileHandle = null;
    gamesFileName = '';

    setLoading(false);
  }
}

async function detectCloudUser(){
  try{
    const {data, error} = await gameCloud.auth.getUser();
    cloudUser = !error && data && data.user ? data.user : null;
  }catch(e){
    cloudUser = null;

}

async function loadCloudGames(){
  if(!cloudUser) return false;
  setLoading(true, 'Lade gespeicherte Spielesammlung …');
  try{
    const path = cloudUser.id + '/Jeopardy-Spiele.json';
    const {data, error} = await gameCloud.storage.from(GAME_STORAGE_BUCKET).download(path);
    if(error){
      const message = String(error.message || '');
      const status = String(error.statusCode || error.status || '');
      if(status === '404' || /not found|does not exist|no such object/i.test(message)) return false;
      toast('Cloud-Datei konnte nicht geladen werden: ' + message);
      return false;
    }
    const parsed = JSON.parse(await data.text());
    if(!Array.isArray(parsed.games)) throw new Error('Die gespeicherte Datei enthält keine gültige Spieleliste.');
    games = parsed.games.map(normalizeGame);
    gamesFileHandle = null;
    gamesFileName = 'Supabase Cloud';
    lastFileAvailable = false;
    current = null;
    dirty = false;
    cloudLibraryLoaded = true;
    toast(games.length + ' Spiele aus der Cloud geladen');

    toast('Cloud-Spielesammlung konnte nicht geladen werden: ' + (e.message || 'Unbekannter Fehler'));
    return false;
  }finally{
    setLoading(false);
  }
}

async function saveGamesToCloud(){
  setLoading(true, 'Speichere Spielesammlung in der Cloud …');
  try{
    const {data: authData, error: authError} = await gameCloud.auth.getUser();
    if(authError || !authData || !authData.user){
      cloudUser = null;
      throw new Error('Bitte melde dich zuerst im Lehrerbereich an und öffne Jeopardy erneut über das Dashboard.');
    }
    cloudUser = authData.user;
    const path = cloudUser.id + '/Jeopardy-Spiele.json';
    const json = JSON.stringify(packGames(), null, 2);
    const file = new Blob([json], {type: 'application/json;charset=utf-8'});
    const {error} = await gameCloud.storage.from(GAME_STORAGE_BUCKET).upload(path, file, {
      contentType: 'application/json',
      cacheControl: '0',
      upsert: true
    });
    if(error) throw error;
    cloudLibraryLoaded = true;
    gamesFileName = 'Supabase Cloud';
    gamesFileHandle = null;
    lastFileAvailable = false;
    dirty = false;
    toast('Spielesammlung dauerhaft in Supabase gespeichert');

  }catch(e){
    await customAlert(
      'Die Spielesammlung konnte nicht in der Cloud gespeichert werden.\n\n' +
      (e.message || 'Unbekannter Fehler') +
      '\n\nDu kannst zusätzlich über „JSON exportieren“ eine lokale Sicherung erstellen.',
      {title: 'Speichern fehlgeschlagen'}
    );
    return false;
  }finally{
    setLoading(false);
  }
}

function exportGamesJson(){

async function openGamesFile(){

    if(!('showOpenFilePicker' in window)) return fallbackOpenGamesFile();

    games = data.games.map(normalizeGame);

    if(e.name !== 'AbortError') await customAlert('Spieldatei konnte nicht geöffnet werden.\n\n' + e.message, {title: 'Fehler'});
  }finally{
    setLoading(false);
  }
}

function fallbackOpenGamesFile(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const f = input.files[0];
    if(!f) return;
    setLoading(true, 'Lese Datei …');
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const data = JSON.parse(fr.result);
        if(!Array.isArray(data.games)) throw new Error('Keine gültige Jeopardy-Spieldatei.');
        games = data.games.map(normalizeGame);
        gamesFileHandle = null;
        gamesFileName = f.name;
        toast(games.length + ' Spiele geladen');
        renderHome();
      }catch(err){
        customAlert('Spieldatei konnte nicht geöffnet werden.\n\n' + err.message, {title: 'Fehler'});
      }finally{
        setLoading(false);
      }
    };
    fr.onerror = () => { setLoading(false); customAlert('Datei konnte nicht gelesen werden.', {title: 'Fehler'}); };
    fr.readAsText(f, 'utf-8');
  };
  input.click();
}

async function saveGamesFile(asNew){
  if(!asNew && cloudUser) return await saveGamesToCloud();
  try{
    if(asNew || !gamesFileHandle){
      if(!('showSaveFilePicker' in window)) return fallbackSaveGamesFile();
      const handle = await window.showSaveFilePicker({
        suggestedName: gamesFileName || 'Jeopardy-Spiele.json',
        types: [{description: 'Jeopardy-Spieldatei', accept: {'application/json': ['.json']}}]
      });
      gamesFileHandle = handle;
      gamesFileName = handle.name;
      lastFileAvailable = true;
      await idbSet('gamesFileHandle', handle);
    }
    setLoading(true, 'Speichere …');
    const writable = await gamesFileHandle.createWritable();
    await writable.write(JSON.stringify(packGames(), null, 2));
    await writable.close();
    dirty = false;
    toast('Spiele gespeichert: ' + gamesFileName);
    return true;
  }catch(e){
    if(e.name !== 'AbortError') await customAlert('Spiele konnten nicht gespeichert werden.\n\n' + e.message, {title: 'Fehler'});
    return false;
  }finally{
    setLoading(false);
  }
}

function fallbackSaveGamesFile(){

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = gamesFileName || 'Jeopardy-Spiele.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  gamesFileHandle = null;
  lastFileAvailable = false;
  idbSet('gamesFileHandle', null);

  if(!handle){ lastFileAvailable = false; renderHome(); return; }
  try{
    if((await handle.queryPermission({mode: 'readwrite'})) !== 'granted'){
      if((await handle.requestPermission({mode: 'readwrite'})) !== 'granted') return;
    }
    setLoading(true, 'Lade …');
    const file = await handle.getFile();
    const data = JSON.parse(await file.text());
    if(!Array.isArray(data.games)) throw new Error('Keine gültige Jeopardy-Spieldatei.');
    games = data.games.map(normalizeGame);
    gamesFileHandle = handle;
    gamesFileName = file.name;
    lastFileAvailable = true;
    toast(games.length + ' Spiele geladen');
    renderHome();
  }catch(e){
    lastFileAvailable = false;
    await customAlert('Die zuletzt verwendete Datei konnte nicht geöffnet werden.\n\n' + e.message, {title: 'Fehler'});
  }finally{
    setLoading(false);
  }
}

async function moveGame(id, direction){
  const from = games.findIndex(g => g.id === id);
  const to = from + direction;
  if(from < 0 || to < 0 || to >= games.length) return;
  [games[from], games[to]] = [games[to], games[from]];
  dirty = true;
  renderHome();
  if(cloudUser && cloudLibraryLoaded){
    const saved = await saveGamesToCloud();
    if(saved) renderHome();
  }else{
    toast('Reihenfolge geändert. Mit „JSON exportieren“ kannst du sie sichern.');
  }
}

        '</select></div>' +

function buildEditor(id){
  const old = id && games.find(x => x.id === id);
  const r = +document.getElementById('rows').value;
  const c = +document.getElementById('cols').value;
  const name = document.getElementById('sname').value.trim() || 'Unbenannt';

  const g = old ? JSON.parse(JSON.stringify(old)) : { id: uid(), cells: {} };
  g.id = g.id || uid();
  const previousRows = old ? old.rows : 0;
  const previousCols = old ? old.cols : 0;
  const previousColHeaders = old && Array.isArray(old.colHeaders) ? old.colHeaders : [];
  const previousRowHeaders = old && Array.isArray(old.rowHeaders) ? old.rowHeaders : [];
  const previousPoints = old && Array.isArray(old.points) ? old.points : [];

  g.name = name;
  g.rows = r;
  g.cols = c;
  g.colHeaders = Array.from({length: c}, (_, i) => {
    const v = previousColHeaders[i];
    return (v && String(v).trim()) || 'Thema ' + (i + 1);
  });
  g.rowHeaders = Array.from({length: r}, (_, i) => {
    const n = Number(previousRowHeaders[i]);
    return String(Number.isFinite(n) ? n : (i + 1) * 100);
  });
  g.points = Array.from({length: r}, (_, i) =>
    Array.from({length: c}, (_, j) => {
      const oldPoint = previousPoints[i] && previousPoints[i][j];
      if(i < previousRows && j < previousCols && Number.isFinite(Number(oldPoint))) return Number(oldPoint);
      return Number(g.rowHeaders[i]);
    })
  );

  const newCells = {};
  for(let i = 0; i < r; i++){
    for(let j = 0; j < c; j++){
      const k = i + ',' + j;
      const existing = g.cells && g.cells[k];
      newCells[k] = existing
        ? { text: existing.text || '', answer: existing.answer || '', type: existing.type || 'text',
            data: existing.data || '', name: existing.name || '', used: false, reduced: false }
        : { text: '', answer: '', type: 'text', data: '', name: '', used: false, reduced: false };
    }
  }
  g.cells = newCells;

  current = g;
  editMode = true;
  currentView = 'board';
  dirty = false;
  closeModal();
  renderBoard();
}

/* ============ Board ============ */
function renderBoard(){
  currentView = 'board';
  document.body.classList.toggle('play-screen', !editMode);
  document.body.classList.toggle('edit-screen', editMode);
  document.getElementById('modalRoot').innerHTML = '';

  const topButtons = editMode
    ? '<button class="gold" id="btnSave">💾 Speichern</button><button class="secondary" id="btnHome">Zur Liste</button>'
    : '<button class="secondary" id="btnTeams">👥 Teams</button>' +
      '<button class="secondary" id="btnUndo">↶ Rückgängig</button>' +
      '<button class="gold" id="btnRestart">↻ Neu starten</button>' +
      '<button class="secondary" id="btnHome">Beenden</button>';

  document.getElementById('app').innerHTML =
    '<div class="top">' +
      '<div class="brand-lockup"><div class="brand-symbol" aria-hidden="true">J</div><div><div class="brand">' + esc(current.name) + '</div><div class="brand-sub">' + (editMode ? 'Spielvorlage bearbeiten' : 'Moderation und Spielstand') + '</div></div></div>' +
      '<div class="row">' + topButtons + '</div>' +
    '</div>' +
    (editMode
      ? '<div class="panel editor-instructions"><b>Spielraster bearbeiten</b><p class="hint">Kategorien und Punktwerte direkt im Raster ändern. Ein Spielfeld anklicken, um Frage, Antwort oder Medien zu bearbeiten. Danach „Speichern“ wählen.</p></div>'
      : '<div id="scorebar" class="scorebar"></div>') +
    '<div class="panel board-wrap ' + (editMode ? 'editor-board-wrap' : 'play-board-wrap') + '">' +
      '<div class="board ' + (editMode ? 'editor-board' : 'play-board') + '" id="board" style="grid-template-columns:' +
        (editMode ? 'minmax(78px,.62fr) ' : '') +
        'repeat(' + current.cols + ',minmax(0,1fr))"></div>' +
    '</div>';

  const boardEl = document.getElementById('board');
  if(!editMode){
    boardEl.style.gridTemplateRows = 'minmax(0.75fr, 1fr) repeat(' + current.rows + ', minmax(0, 1fr))';
  }else{
    boardEl.style.gridTemplateRows = 'minmax(54px, .7fr) repeat(' + current.rows + ', minmax(90px, 1fr))';
  }

  if(editMode){
    const pointsHeading = document.createElement('div');
    pointsHeading.className = 'cell header row-point-label';
    pointsHeading.textContent = 'Punktwert';
    boardEl.appendChild(pointsHeading);
  }

  current.colHeaders.forEach((h, j) => {
    const d = document.createElement('div');
    d.className = 'cell header' + (editMode ? ' header-editable' : '');
    if(editMode){
      d.innerHTML = '<input class="grid-header-input" type="text" data-col-header="' + j + '" aria-label="Kategorie ' + (j + 1) + '" value="' + esc(h) + '">';
      const input = d.querySelector('input');
      input.addEventListener('input', e => {
        current.colHeaders[j] = e.target.value;
        dirty = true;
      });
      input.addEventListener('keydown', e => e.stopPropagation());
    }else{
      d.textContent = h;
    }
    boardEl.appendChild(d);
  });

  for(let i = 0; i < current.rows; i++){
    if(editMode){
      const pointCell = document.createElement('div');
      pointCell.className = 'cell row-point-editor';
      pointCell.innerHTML =
        '<span class="row-point-label-small">Reihe ' + (i + 1) + '</span>' +
        '<input class="grid-points-input" type="number" min="0" step="1" inputmode="numeric" data-row-points="' + i + '" aria-label="Punktwert für Reihe ' + (i + 1) + '" value="' + esc(current.rowHeaders[i] ?? (i + 1) * 100) + '">';
      const input = pointCell.querySelector('input');
      input.addEventListener('input', e => {
        dirty = true;
        const raw = e.target.value;
        if(raw.trim() === '') return;
        const value = Number(raw);
        if(!Number.isFinite(value)) return;
        current.rowHeaders[i] = String(value);
        current.points[i] = Array.from({length: current.cols}, () => value);
      });
      input.addEventListener('keydown', e => e.stopPropagation());
      input.addEventListener('click', e => e.stopPropagation());
      boardEl.appendChild(pointCell);
    }

    for(let j = 0; j < current.cols; j++){
      const k = i + ',' + j;
      const c = current.cells[k] || {};
      const basePoints = Number((current.points && current.points[i] && current.points[i][j]) ?? Number(current.rowHeaders[i]) ?? (i + 1) * 100);
      const displayPoints = (c.reduced && !c.used) ? Math.floor(basePoints / 2) : basePoints;

      const btn = document.createElement(editMode ? 'div' : 'button');
      if(!editMode) btn.type = 'button';
      else{
        btn.setAttribute('role', 'button');
        btn.tabIndex = 0;
      }
      btn.className = 'cell';
      btn.dataset.i = i;
      btn.dataset.j = j;

      if(editMode){
        const hasQ = Boolean(String(c.text || '').trim());
        btn.classList.add('editable');
        btn.innerHTML = '<span class="cell-status ' + (hasQ ? 'has-question' : 'no-question') + '">' +
                        (hasQ ? '✓ Frage bearbeiten' : '＋ Frage ergänzen') + '</span>';
        btn.setAttribute('aria-label', 'Frage für ' + current.colHeaders[j] + ', Reihe ' + (i + 1) + ' bearbeiten');
      } else {
        if(c.used){
          btn.classList.add('used');
          btn.disabled = true;
          if(c.awardedTeam){
            btn.innerHTML = '<span class="played-team">' + esc(c.awardedTeam) + '</span>' +
                            '<span class="played-points">(' + (Number(c.awardedPoints) > 0 ? '+' : '') + esc(Number(c.awardedPoints) || 0) + ')</span>';
            btn.setAttribute('aria-label', 'Gewonnen von ' + c.awardedTeam + ', ' + (Number(c.awardedPoints) || 0) + ' Punkte');
          }else{
            btn.textContent = '✓';
            btn.setAttribute('aria-label', 'Bereits gespielt');
          }
        } else {
          if(c.reduced) btn.classList.add('reduced');
          btn.textContent = String(displayPoints);
          btn.setAttribute('aria-label', displayPoints + ' Punkte, ' + current.colHeaders[j]);
        }
      }

      btn.addEventListener('click', () => {
        if(btn.disabled) return;
        if(editMode) editCell(i, j);
        else openCell(i, j);
      });
      btn.addEventListener('keydown', e => {
        if(editMode && (e.key === 'Enter' || e.key === ' ')){
          e.preventDefault();
          editCell(i, j);
          return;
        }
        handleBoardKey(e, i, j);
      });
      boardEl.appendChild(btn);
    }
  }

  if(!editMode) renderTeams();

  const btnHome = document.getElementById('btnHome');
  btnHome.onclick = async () => {
    if(editMode && dirty){
      const ok = await customConfirm('Es gibt ungespeicherte Änderungen. Zur Liste zurückkehren und verwerfen?',
        { danger: true, okLabel: 'Verwerfen', title: 'Ungespeicherte Änderungen' });
      if(!ok) return;
    }
    renderHome();
  };

  const saveBtn = document.getElementById('btnSave');
  if(saveBtn) saveBtn.onclick = () => saveCurrent();

  const teamBtn = document.getElementById('btnTeams');
  if(teamBtn) teamBtn.onclick = () => manageTeams();

  const undoBtn = document.getElementById('btnUndo');
  if(undoBtn){
    undoBtn.disabled = undoStack.length === 0;
    undoBtn.onclick = () => undoLast();
  }

  const restartBtn = document.getElementById('btnRestart');
  if(restartBtn) restartBtn.onclick = () => restartGame();
}

function handleBoardKey(e, i, j){
  let ni = i, nj = j;
  switch(e.key){
    case 'ArrowUp': ni = Math.max(0, i - 1); break;
    case 'ArrowDown': ni = Math.min(current.rows - 1, i + 1); break;
    case 'ArrowLeft': nj = Math.max(0, j - 1); break;
    case 'ArrowRight': nj = Math.min(current.cols - 1, j + 1); break;
    default: return;
  }
  e.preventDefault();
  const next = document.querySelector('.cell[data-i="' + ni + '"][data-j="' + nj + '"]');
  if(next && !next.disabled) next.focus();
}

function focusCellOrNext(i, j){
  let el = document.querySelector('.cell[data-i="' + i + '"][data-j="' + j + '"]');
  if(el && !el.disabled){ el.focus(); return; }
  for(let jj = j + 1; jj < current.cols; jj++){
    el = document.querySelector('.cell[data-i="' + i + '"][data-j="' + jj + '"]');
    if(el && !el.disabled){ el.focus(); return; }
  }
  for(let ii = i + 1; ii < current.rows; ii++){
    for(let jj = 0; jj < current.cols; jj++){
      el = document.querySelector('.cell[data-i="' + ii + '"][data-j="' + jj + '"]');
      if(el && !el.disabled){ el.focus(); return; }
    }
  }
}

/* ============ Edit Cell ============ */
function editCell(i, j){
  const c = current.cells[i + ',' + j] || { text: '', answer: '', type: 'text', data: '', name: '' };
  const currentMedia = c.data
    ? '<div class="hint" style="margin-top:6px">Aktuelle Datei: <b>' + esc(c.name || 'eingebettete Datei') + '</b> (' + esc(c.type) + ')</div>'
    : '<div class="hint" style="margin-top:6px">Keine Datei hinterlegt.</div>';

  openModalWithFocus(
    '<h2>Feld bearbeiten</h2>' +
    '<div class="field"><label for="ctext">Frage / Aufgabe</label>' +
      '<textarea id="ctext" placeholder="Hier die Frage eingeben...">' + esc(c.text || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:10px"><label for="canswer">Antwort</label>' +
      '<textarea id="canswer" placeholder="Hier die richtige Antwort eingeben...">' + esc(c.answer || '') + '</textarea></div>' +
    '<div class="field" style="margin-top:10px"><label for="ctype">Medientyp</label>' +
      '<select id="ctype">' +
        '<option value="text">Nur Text</option>' +
        '<option value="image">Bild</option>' +
        '<option value="audio">MP3 / Audio</option>' +
        '<option value="video">Video</option>' +
      '</select></div>' +
    '<div class="field" style="margin-top:10px"><label for="cfile">Datei auswählen</label>' +
      '<input id="cfile" type="file" accept="image/*,audio/*,video/*">' +
      currentMedia +
      '<div class="hint">Die Datei wird beim Speichern direkt in die gewählte Spiele-Datei eingebettet. Dateien über ' + (MAX_MEDIA_SIZE / 1024 / 1024) + ' MB blähen die JSON-Datei stark auf.</div>' +
    '</div>' +
    '<div class="row" style="margin-top:15px">' +
      '<button id="btnCellSave">Übernehmen</button>' +
      (c.data ? '<button class="danger" id="btnCellRemoveMedia">Medien entfernen</button>' : '') +
      '<button class="secondary" id="btnCellCancel">Abbrechen</button>' +
    '</div>',
    { focus: '#ctext' }
  );

  document.getElementById('ctype').value = c.type || 'text';
  document.getElementById('btnCellCancel').onclick = () => closeModal();
  document.getElementById('btnCellSave').onclick = () => saveCell(i, j, c);
  const rm = document.getElementById('btnCellRemoveMedia');
  if(rm) rm.onclick = () => {
    current.cells[i + ',' + j] = { ...c, data: '', name: '', type: 'text' };
    dirty = true;
    closeModal();
    renderBoard();
    toast('Medien entfernt');
  };
}

function saveCell(i, j, old){
  const type = document.getElementById('ctype').value;
  const text = document.getElementById('ctext').value;
  const answer = document.getElementById('canswer').value;
  const file = document.getElementById('cfile').files[0];

  if(file){
    if(file.size > MAX_MEDIA_SIZE){
      customConfirm(
        'Die Datei ist ' + (file.size / 1024 / 1024).toFixed(1) + ' MB groß. Das kann die JSON-Datei stark vergrößern. Fortfahren?',
        { danger: true, okLabel: 'Fortfahren', title: 'Große Datei' }
      ).then(ok => { if(ok) readAndStoreFile(file, i, j, type, text, answer); });
      return;
    }
    readAndStoreFile(file, i, j, type, text, answer);
  } else {
    current.cells[i + ',' + j] = {
      ...old,
      text, answer,
      type: type || 'text',
      data: type === 'text' ? '' : (old.data || ''),
      name: type === 'text' ? '' : (old.name || ''),
      used: false, reduced: false
    };
    dirty = true;
    closeModal();
    renderBoard();
  }
}

function readAndStoreFile(file, i, j, type, text, answer){
  setLoading(true, 'Lese Datei …');
  const fr = new FileReader();
  fr.onload = () => {
    current.cells[i + ',' + j] = {
      text, answer, type,
      data: fr.result,
      name: file.name,
      used: false, reduced: false
    };
    dirty = true;
    setLoading(false);
    closeModal();
    renderBoard();
  };
  fr.onerror = () => {
    setLoading(false);
    customAlert('Datei konnte nicht gelesen werden.', {title: 'Fehler'});
  };
  fr.readAsDataURL(file);
}

async function saveCurrent(){
  const idx = games.findIndex(x => x.id === current.id);
  if(idx < 0) games.push(current);
  else games[idx] = current;
  const ok = await saveGamesFile(false);
  if(ok) renderHome();
}

function editGame(id){
  const g = games.find(x => x.id === id);
  if(g) openSetup(g);
}

async function deleteGame(id){
  const ok = await customConfirm('Spiel wirklich löschen?', { danger: true, okLabel: 'Löschen', title: 'Spiel löschen' });
  if(!ok) return;
  games = games.filter(g => g.id !== id);
  if(cloudUser || gamesFileHandle){
    const saved = await saveGamesFile(false);
    renderHome();
    if(!saved) toast('Spiel lokal entfernt; die Änderung wurde noch nicht gespeichert.');
  } else {
    renderHome();
    toast('Spiel entfernt. Zum dauerhaften Speichern bitte anmelden oder JSON exportieren.');
  }
}

/* ============ Teams ============ */
function scoreToneClass(score){
  const value = Number(score) || 0;
  return value > 0 ? 'positive' : value < 0 ? 'negative' : 'zero';
}

function renderTeams(){
  const bar = document.getElementById('scorebar');
  if(!bar) return;
  bar.innerHTML = teams.map((t, i) =>
    '<div class="team" data-team="' + i + '">' +
      '<input value="' + esc(t.name) + '" data-role="name" aria-label="Teamname">' +
      '<div class="score ' + scoreToneClass(t.score) + '" data-role="score" role="button" tabindex="0" aria-label="Punktestand von ' + esc(t.name) + ': ' + t.score + '. Zum Ändern klicken.">' + t.score + '</div>' +
    '</div>'
  ).join('');

  document.querySelectorAll('.team').forEach(el => {
    const i = +el.getAttribute('data-team');
    el.querySelector('[data-role="name"]').addEventListener('change', e => { teams[i].name = e.target.value; });
    const scoreEl = el.querySelector('[data-role="score"]');
    scoreEl.addEventListener('click', () => changeScore(i));
    scoreEl.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); changeScore(i); }
    });
  });
}

function flashTeam(i, delta){
  const el = document.querySelector('.team[data-team="' + i + '"]');
  if(!el) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 600);
  const d = document.createElement('div');
  d.className = 'score-delta' + (delta < 0 ? ' neg' : '');
  d.textContent = (delta > 0 ? '+' : '') + delta;
  el.querySelector('.score').appendChild(d);
  setTimeout(() => d.remove(), 1300);
}

async function changeScore(i){
  const v = await customPrompt('Neuen Punktestand eingeben:', String(teams[i].score), { title: 'Punktestand ändern', type: 'number' });
  if(v === null) return;
  const n = Number(v);
  if(Number.isFinite(n)){ teams[i].score = n; renderTeams(); }
}

async function manageTeams(){
  function listHTML(){
    return teams.map((t, i) =>
      '<div class="row" style="margin-bottom:6px">' +
        '<input class="team-name-input" value="' + esc(t.name) + '" data-team-name="' + i + '">' +
        '<button class="danger" data-team-del="' + i + '" ' + (teams.length <= 1 ? 'disabled' : '') + '>Entfernen</button>' +
      '</div>'
    ).join('');
  }
  openModalWithFocus(
    '<h2>Teams verwalten</h2>' +
    '<div id="teamList">' + listHTML() + '</div>' +
    '<div class="row" style="margin-top:12px">' +
      '<button id="btnAddTeam" ' + (teams.length >= 8 ? 'disabled' : '') + '>＋ Team hinzufügen</button>' +
    '</div>' +
    '<div class="row" style="margin-top:16px"><button id="btnTeamDone">Fertig</button></div>',
    { focus: '#btnTeamDone' }
  );

  function collect(){
    document.querySelectorAll('[data-team-name]').forEach(inp => {
      const i = +inp.getAttribute('data-team-name');
      if(teams[i]) teams[i].name = inp.value;
    });
  }
  function refresh(){
    document.getElementById('teamList').innerHTML = listHTML();
    document.getElementById('btnAddTeam').disabled = teams.length >= 8;
    bind();
  }
  function bind(){
    document.querySelectorAll('[data-team-del]').forEach(b => {
      b.onclick = () => {
        collect();
        const i = +b.getAttribute('data-team-del');
        if(teams.length <= 1) return;
        teams.splice(i, 1);
        refresh();
      };
    });
  }
  bind();
  document.getElementById('btnAddTeam').onclick = () => {
    collect();
    if(teams.length >= 8) return;
    teams.push({ name: 'Team ' + (teams.length + 1), score: 0 });
    refresh();
  };
  document.getElementById('btnTeamDone').onclick = () => {
    collect();
    closeModal();
    renderTeams();
  };
}

/* ============ Game Flow ============ */
async function startGame(id){
  const selected = games.find(g => g.id === id);
  if(!selected) return;
  const nStr = await customPrompt('Wie viele Teams? (1–8)', '2', { title: 'Teams', type: 'number', min: 1, max: 8 });
  if(nStr === null) return;
  const n = Math.max(1, Math.min(8, parseInt(nStr, 10) || 2));

  current = JSON.parse(JSON.stringify(selected));
  for(const cell of Object.values(current.cells || {})){
    cell.used = false;
    cell.reduced = false;
    delete cell.awardedTeam;
    delete cell.awardedPoints;
  }
  teams = Array.from({length: n}, (_, i) => ({ name: 'Team ' + (i + 1), score: 0 }));
  editMode = false;
  currentView = 'board';
  undoStack = [];
  dirty = false;
  renderBoard();
}

async function restartGame(){
  if(!current) return;
  const ok = await customConfirm(
    'Spiel neu starten? Alle gespielten Felder und Punktestände werden auf den Anfangszustand zurückgesetzt.',
    { danger: true, okLabel: 'Neu starten', title: 'Neu starten' }
  );
  if(!ok) return;
  for(const cell of Object.values(current.cells || {})){
    cell.used = false;
    cell.reduced = false;
    delete cell.awardedTeam;
    delete cell.awardedPoints;
  }
  teams = teams.map((t, i) => ({ name: t.name || ('Team ' + (i + 1)), score: 0 }));
  undoStack = [];
  renderBoard();
  toast('Spiel wurde neu gestartet');
}

/* ============ Undo ============ */
function snapshot(){
  return {
    teams: teams.map(t => ({...t})),
    cells: Object.fromEntries(Object.entries(current.cells).map(([k, v]) => [k, {...v}]))
  };
}
function restoreSnapshot(snap){
  teams = snap.teams.map(t => ({...t}));
  current.cells = Object.fromEntries(Object.entries(snap.cells).map(([k, v]) => [k, {...v}]));
}
function pushUndo(){
  undoStack.push(snapshot());
  if(undoStack.length > 50) undoStack.shift();
}
async function undoLast(){
  if(!undoStack.length) return;
  const snap = undoStack.pop();
  restoreSnapshot(snap);
  renderBoard();
  toast('Letzte Aktion rückgängig gemacht');
}

/* ============ Cell Play ============ */
function openCell(i, j){
  const c = current.cells[i + ',' + j];
  if(!c || c.used) return;

  const basePoints = Number((current.points && current.points[i] && current.points[i][j]) ?? Number(current.rowHeaders[i]) ?? (i + 1) * 100);
  const points = c.reduced ? Math.floor(basePoints / 2) : basePoints;
  const half = Math.floor(points / 2);
  const valueNote = c.reduced
    ? '<div class="hint reduced-note" style="margin-top:8px">Dieses Feld wurde bereits einmal zum Abstauben freigegeben. Es ist jetzt nur noch ' + points + ' Punkte wert.</div>'
    : '';
  const hasQuestion = Boolean(String(c.text || '').trim());

  openModalWithFocus(
    '<h2>' + esc(points) + ' Punkte · ' + esc(current.colHeaders[j]) + '</h2>' +
    valueNote +
    '<div class="question-box">' + esc(c.text || '') + '</div>' +
    (c.type === 'image' && c.data ? '<img class="media-preview" src="' + c.data + '" alt="">' : '') +
    (c.type === 'audio' && c.data ? '<audio class="media-preview" controls src="' + c.data + '"></audio>' : '') +
    (c.type === 'video' && c.data ? '<video class="media-preview" controls src="' + c.data + '"></video>' : '') +
    '<div id="answerArea" aria-live="polite"></div>' +
    '<div id="outcomeActions">' +
      '<div class="outcome-grid">' +
        '<div class="action-block"><h4>✓ Richtig · +' + points + ' Punkte</h4>' +
          '<div class="action-team-grid">' + teams.map((t, idx) =>
            '<button class="team-award" data-award="' + idx + '">' + esc(t.name || ('Team ' + (idx + 1))) + '</button>').join('') +
          '</div></div>' +
        '<div class="action-block"><h4>✕ Falsch · −' + half + ' Punkte</h4>' +
          '<div class="action-team-grid">' + teams.map((t, idx) =>
            '<button class="team-deduct" data-wrong="' + idx + '">' + esc(t.name || ('Team ' + (idx + 1))) + '</button>').join('') +
          '</div></div>' +
      '</div>' +
      '<button class="no-answer-trigger" id="btnNoAnswer" type="button">Keine Antwort</button>' +
    '</div>' +
    (!hasQuestion ? '<div class="hint warning-note" style="margin-top:14px">Hinweis: Für dieses Feld wurde noch keine Frage hinterlegt.</div>' : '') +
    '<div class="row" style="margin-top:18px"><button class="secondary" id="btnCloseCell">Schließen</button></div>',
    { focus: '#btnCloseCell' }
  );

  document.getElementById('btnCloseCell').onclick = () => closeModal();
  document.getElementById('btnNoAnswer').onclick = () => finishCell(i, j);
  document.querySelectorAll('[data-award]').forEach(b =>
    b.onclick = () => awardTeam(i, j, +b.getAttribute('data-award'), points));
  document.querySelectorAll('[data-wrong]').forEach(b =>
    b.onclick = () => wrongAnswer(i, j, +b.getAttribute('data-wrong'), points));
}

function revealSolution(i, j){
  const c = current.cells[i + ',' + j] || {};
  const area = document.getElementById('answerArea');
  if(!area) return;
  area.innerHTML =
    '<div class="answer-reveal" role="status" aria-live="polite">' +
      '<div class="answer-label">Lösung</div>' +
      '<div class="answer-text">' + esc(c.answer || 'Keine Antwort hinterlegt.') + '</div>' +
    '</div>';
}

function showAwardConfirmation(teamName, points){
  const outcome = document.getElementById('outcomeActions');
  if(!outcome) return;
  outcome.innerHTML =
    '<div class="award-confirmation" role="status">' +
      '<span aria-hidden="true">✓</span><span><strong>' + esc(teamName) + '</strong> erhält (' +
      (Number(points) > 0 ? '+' : '') + esc(Number(points) || 0) + ' Punkte).</span>' +
    '</div>';
}

function updatePlayedBoardCell(i, j, cell){
  const btn = document.querySelector('.cell[data-i="' + i + '"][data-j="' + j + '"]');
  if(!btn) return;
  btn.classList.add('used');
  btn.classList.remove('reduced');
  btn.disabled = true;
  btn.innerHTML = '<span class="played-team">' + esc(cell.awardedTeam || '') + '</span>' +
                  '<span class="played-points">(' + (Number(cell.awardedPoints) > 0 ? '+' : '') + esc(Number(cell.awardedPoints) || 0) + ')</span>';
  btn.setAttribute('aria-label', 'Gewonnen von ' + (cell.awardedTeam || 'unbekannt') + ', ' + (Number(cell.awardedPoints) || 0) + ' Punkte');
}

function updateTeamScore(ti, delta){
  const team = teams[ti];
  if(!team) return;
  const el = document.querySelector('.team[data-team="' + ti + '"] .score');
  if(el){
    el.textContent = String(team.score);
    el.classList.remove('positive', 'negative', 'zero');
    el.classList.add(scoreToneClass(team.score));
    flashTeam(ti, delta);
  }
}

function awardTeam(i, j, ti, p){
  if(ti < 0 || ti >= teams.length) return;
  const cell = current.cells[i + ',' + j];
  if(!cell || cell.used) return;
  pushUndo();
  const points = Number(p) || 0;
  const teamName = teams[ti].name || ('Team ' + (ti + 1));
  teams[ti].score += points;
  cell.used = true;
  cell.reduced = false;
  cell.awardedTeam = teamName;
  cell.awardedPoints = points;
  updateTeamScore(ti, points);
  updatePlayedBoardCell(i, j, cell);
  revealSolution(i, j);
  showAwardConfirmation(teamName, points);
  toast('+' + points + ' Punkte für ' + teamName);
}

function wrongAnswer(i, j, ti, p){
  if(ti < 0 || ti >= teams.length) return;
  pushUndo();
  const points = Number(p) || 0;
  const half = Math.floor(points / 2);
  teams[ti].score -= half;

  const scoreEl = document.querySelector('.team[data-team="' + ti + '"] .score');
  if(scoreEl){
    scoreEl.textContent = teams[ti].score;
    scoreEl.classList.remove('positive', 'negative', 'zero');
    scoreEl.classList.add(scoreToneClass(teams[ti].score));
    flashTeam(ti, -half);
  } else {
    renderTeams();
  }

  const area = document.getElementById('answerArea');
  const outcome = document.getElementById('outcomeActions');
  if(outcome){
    outcome.innerHTML =
      '<div class="action-block" style="margin-top:14px">' +
        '<h4>❌ ' + esc(teams[ti].name || ('Team ' + (ti + 1))) + ' hat falsch geantwortet</h4>' +
        '<div class="action-help">' + half + ' Punkte wurden abgezogen. Jetzt dürfen die anderen Teams abstauben.</div>' +
        '<div class="row" style="margin-top:10px">' +
          teams.map((t, idx) => idx === ti ? '' :
            '<button class="team-award" data-steal="' + idx + '">' + esc(t.name || ('Team ' + (idx + 1))) + '</button>').join('') +
        '</div>' +
        '<button class="secondary" style="margin-top:10px" id="btnNoSteal">Niemand staubt ab</button>' +
      '</div>';
    document.querySelectorAll('[data-steal]').forEach(b =>
      b.onclick = () => stealTeam(i, j, +b.getAttribute('data-steal'), half));
    document.getElementById('btnNoSteal').onclick = () => finishCell(i, j);
  }
  if(area){
    area.innerHTML =
      '<div class="wrong-answer">' +
        '<b>' + esc(teams[ti].name || ('Team ' + (ti + 1))) + '</b> hat die Frage falsch beantwortet und erhält <b>-' + half + '</b> Punkte.' +
      '</div>';
  }
  toast('-' + half + ' Punkte für ' + (teams[ti].name || ('Team ' + (ti + 1))));
}

function stealTeam(i, j, ti, p){
  if(ti < 0 || ti >= teams.length) return;
  const cell = current.cells[i + ',' + j];
  if(!cell || cell.used) return;
  pushUndo();
  const points = Number(p) || 0;
  const teamName = teams[ti].name || ('Team ' + (ti + 1));
  teams[ti].score += points;
  cell.used = true;
  cell.reduced = false;
  cell.awardedTeam = teamName;
  cell.awardedPoints = points;
  updateTeamScore(ti, points);
  updatePlayedBoardCell(i, j, cell);
  revealSolution(i, j);
  showAwardConfirmation(teamName, points);
  toast('+' + points + ' Abstauberpunkte für ' + teamName);
}

function finishCell(i, j){
  pushUndo();
  const c = current.cells[i + ',' + j] || {};
  c.used = false;
  c.reduced = true;
  current.cells[i + ',' + j] = c;
  closeModal();
  renderBoard();
  toast('Niemand staubt ab – das Feld ist jetzt nur noch die Hälfte wert.');
  focusCellOrNext(i, j);
}

/* ============ Init ============ */
window.addEventListener('beforeunload', e => {
  if(dirty){
    e.preventDefault();
    e.returnValue = '';
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.getElementById('modalRoot').innerHTML){
    // Fallback – wird normalerweise vom Modal-Listener abgefangen
  }
});

async function initializeJeopardy(){
  renderHome();
  await detectCloudUser();
  if(cloudUser && await loadCloudGames()){
    renderHome();
    return;
  }
  await restoreLastFile();
  if(!games.length) await loadSharedCatalog();
  renderHome();
}
initializeJeopardy();
</script>
